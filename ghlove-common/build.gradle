bootJar{
    enabled = false
}
bootRun{
    enabled = false
}
jar {
    enabled = true
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
    set('SPRING_VERSION', '5.3.20')
    set('SPRING_SECURITY_VERSION', '5.7.1')
    set('SPRING_SESSION', '2.7.0')
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.session:spring-session-bom:2020.0.3'
    }
}

dependencies {
    // 외부 Library
    implementation fileTree(dir: '../libs', includes: ['*.jar'])

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    implementation "org.springframework:spring-oxm:${SPRING_VERSION}"
    implementation "org.springframework:spring-context-support:${SPRING_VERSION}"
    implementation "org.springframework.security:spring-security-taglibs:${SPRING_SECURITY_VERSION}"


	//kdj - 위치 web으로 이동
    // implementation 'org.springframework.session:spring-session-jdbc'

    // ModelMapper
    implementation "org.modelmapper:modelmapper:2.4.4"

    // Jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.10.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.10.5',
            'io.jsonwebtoken:jjwt-jackson:0.10.5'

    // Database
    implementation "org.apache.commons:commons-dbcp2:2.7.0"
    implementation 'com.mchange:mchange-commons-java:0.2.20'

    // DB Vendor
    runtimeOnly 'mysql:mysql-connector-java'
    //runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    //runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
    //runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    //runtimeOnly 'org.postgresql:postgresql'

    implementation "net.sf.ehcache:ehcache-core:2.6.6"
    implementation "org.codehaus.castor:castor:1.2"
    implementation "net.coobird:thumbnailator:0.4.8"
    implementation "jmimemagic:jmimemagic:0.1.2"
    implementation "commons-fileupload:commons-fileupload:1.3.1"
    implementation "commons-io:commons-io:2.5"
    implementation "org.apache.commons:commons-compress:1.14"
    implementation "commons-lang:commons-lang:2.6"
    implementation "org.apache.commons:commons-compress:1.18"

    // Http Client
    implementation "org.apache.httpcomponents:httpclient:4.5.2"
    implementation "org.apache.httpcomponents:httpmime:4.5.2"

    // Mime Type
    implementation "org.apache.tika:tika-core:1.27"

    // Quartz
    implementation "org.quartz-scheduler:quartz:2.2.0"


    // Notification
    implementation "com.sun.mail:javax.mail:1.6.0"
    implementation "org.twitter4j:twitter4j-core:2.2.2"


    // Excel
    implementation "org.apache.poi:poi:4.1.2"
    implementation "org.apache.poi:poi-ooxml:4.1.2"
    implementation "com.jcraft:jsch:0.1.50"
    implementation "net.sf.supercsv:super-csv:2.1.0"

    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'

    // external lib
    implementation "kr.co.linkhub:popbill-sdk:1.13.1"
    implementation 'net.sf.ezmorph:ezmorph:1.0.6'

    // google auth
    implementation 'com.google.auth:google-auth-library-oauth2-http:0.21.1'

    // reflections
    implementation 'org.reflections:reflections:0.10.2'

    // aws
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.136'

    // Azure Blob Storage
    implementation 'com.azure:azure-storage-blob:12.14.2'
    implementation 'com.azure:azure-storage-blob-batch:12.11.2'

    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 이미지 변환 관련
    implementation 'com.twelvemonkeys.common:common-lang:3.9.4'
    implementation 'com.twelvemonkeys.common:common-io:3.9.4'
    implementation 'com.twelvemonkeys.common:common-image:3.9.4'
    implementation 'com.twelvemonkeys.imageio:imageio-core:3.9.4'
    implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.9.4'
    implementation 'com.twelvemonkeys.imageio:imageio-tiff:3.9.4'
    implementation 'com.twelvemonkeys.imageio:imageio-bmp:3.9.4'
    implementation 'com.twelvemonkeys.imageio:imageio-pcx:3.9.4'
    implementation 'com.twelvemonkeys.imageio:imageio-pict:3.9.4'
    implementation 'com.twelvemonkeys.imageio:imageio-pdf:3.9.4'
    implementation 'com.twelvemonkeys.imageio:imageio-metadata:3.9.4'

    // QR 코드 관련
	implementation 'com.google.zxing:javase:3.5.2'
	implementation 'com.google.zxing:core:3.5.2'
}
repositories {
    mavenCentral()
}

task copyApplicationYml {
	doLast{
		Thread.sleep(500);
		def profile = project.hasProperty('active') ? project.active : 'local'
		def srcFile = file("src/main/resources/application-${profile}.yml")
		def dstFile = file("src/main/resources/application.yml")

		if ( srcFile.exists()) {
			dstFile.write(srcFile.getText('UTF-8'), 'UTF-8')
			println "Copied application-${profile}.yml -> application.yml"
		}else{
			thorw new GradleException("application-${profile}.yml not found")
		}
	}
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    dependsOn(copyApplicationYml)
    doLast {
    	Thread.sleep(500);
    	def dstFile = file("src/main/resources/application.yml")
    	def srcFile = file("src/main/resources/application-local.yml")

    	if ( srcFile.exists()) {
			dstFile.write(srcFile.getText('UTF-8'), 'UTF-8')
			println "Copied application-local.yml -> application.yml"
		}else{
			thorw new GradleException("application-local.yml not found")
		}

    }
}

