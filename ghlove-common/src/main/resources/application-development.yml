#######################
# Server
#######################
server:
  port: 8080
  ajp:
    protocol: AJP/1.3
    port: 8009
    enabled: false
  ssl:
    enabled: false
    key-store: ${saleson.file-root}/keystore/saleson.keystore
    key-store-password: 111111

  error:
    whitelabel.enabled: false
    include-stacktrace: NEVER

  servlet:
    context-parameters.defaultHtmlEscape: false

  tomcat:
    additional-tld-skip-patterns: "*mchange-commons-java*.jar"
    basedir: ${saleson.file-root}/temp

  # HTTP encoding (HttpEncodingProperties)
  http:
    encoding:
      force-request: true
      charset: UTF-8
      enabled: true
      force: true



#######################
# Spring
#######################
spring:
  main.allow-bean-definition-overriding: true
  security.filter.order: 100
  output.ansi.enabled: NEVER
  jackson:
    serialization:
      fail-on-empty-beans: false
      WRITE_DATES_AS_TIMESTAMPS: false
    deserialization.fail-on-unknown-properties: false
  devtools:
    livereload.enabled: false
    restart.enabled: false
  thymeleaf.cache: false
  aop.auto: true      # enables AOP using @EnableAspectJAutoProxy annotation
  pid.file: saleson.pid
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher


