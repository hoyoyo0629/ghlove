    maximum-pool-size: 10
    pool-name: pool-saleson
    data-source-properties:
      rewriteBatchedStatements: true

  # 서비스 DOMAIN
  url:
    shoppingmall: http://152.99.104.8
    bo: http://152.99.104.8
    api: http://152.99.104.8
    frontend: http://152.99.104.8
