  type: local
  azure:
    accountName: ""
    accountKey: ""
  aws:
    accessKey: ""
    secretKey: ""
    bucketName: ""

# 업로드 root (파일정보 저장 시 /abc/ef/g.jpg 형태로 저장된 경우 물리적 위치 기준 - 마이그레이션 시 경로까지 저장한 경우 사용)
upload:
  root: ${saleson.storage-root}

  # 업로드 경로 (browser 접속 시 시작경로)
  base.folder: /upload

  # 업로드 경로 - 물리적 저장 경로 (absolute path)
  save.folder: ${saleson.storage-root}/upload

  # 파일명 저장 방식 (1:원본파일명, 2:파일 키로 변환)
  option.save.filename: 2


# Resource Location
resource:
  static.location: file:${saleson.static-root}
  storage.location: file:${saleson.storage-root}

  # Resources Folders
  request.uris: /content,/upload


