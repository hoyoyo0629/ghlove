<!DOCTYPE html>
<html lang="ko" class="opmanager">

<head>
    <meta charset="UTF-8">
    <title>고향사랑 관리자</title>
    <meta name="_csrf" content="d5b3758e-5c8b-415e-a30a-3d62a00f6234">
    <meta name="_csrf_header" content="X-CSRF-TOKEN">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../content/images/common/favicon.ico">


    <link rel="stylesheet" type="text/css" href="../../content/opmanager/css/ui-lightness/jquery-ui-1.10.3.custom.min.css">
    <link rel="stylesheet" type="text/css" href="../../content/opmanager/css/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="../../content/opmanager/css/opmanager.css">
    <link rel="stylesheet" type="text/css" href="../../content/opmanager/css/opmanager_print.css" media="print">
    <link rel="stylesheet" type="text/css" href="../../content/modules/jquery/jstree/dist/themes/default/style.min.css">

    <script type="text/javascript">var OP_CONTEXT_PATH = '';</script>
    <script type="text/javascript">var OP_LANGUAGE = 'ko';</script>
    <script type="text/javascript">var OP_MANAGER_TIMEOUT = '200';</script>
    <script type="text/javascript">var OP_MANAGER_TIMEOUT_TYPE = 'manager';</script>
    <!-- /  <script type="text/javascript" src="../../content/modules/jquery/jquery-1.11.0.min.js"></script> -->
    <script type="text/javascript" src="../../content/modules/jquery/jquery.cookie.js"></script>
    <script type="text/javascript" src="../../content/modules/jquery/jquery-ui-1.10.4.custom.js"></script>
    <script type="text/javascript" src="../../content/modules/spin.min.js"></script>
    <style type="text/css"></style>
    <script type="text/javascript" src="../../content/modules/op.common.js"></script>
    <script type="text/javascript" src="../../content/modules/op.link.js" charset="utf-8"></script>
    <script type="text/javascript" src="../../content/modules/op.main.js"></script>
    <script type="text/javascript" src="../../content/modules/op.validator.js"></script>
    <script type="text/javascript" src="../../content/modules/op.file.js"></script>
    <script type="text/javascript" src="../../content/modules/op.shop.js"></script>
    <script type="text/javascript" src="../../content/modules/op.manager.js"></script>
    <script type="text/javascript" src="../../content/modules/op.manager.order.js"></script>
    <script type="text/javascript" src="../../content/modules/css_browser_selector.js"></script>
    <script type="text/javascript" src="../../content/modules/jquery/jstree/dist/jstree.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- 개발 영역 -->
    <div class="admin_wrap">
        <!-- 내용 -->
        <div id="container">
            <div class="contents">
                <div class="contents_inner">
                    <!-- 상단 타이틀 영역 -->
                    <div class="location">
                        <a href="">답례품 관리</a> &gt; <a href="">특산물관 관리</a>
                    </div>
                    <h3><span>특산물관 관리</span></h3>
                    <!-- // 상단 타이틀 영역 -->

                    <div class="board_write">
                        <table class="board_write_table" summary="">
                            <colgroup>
                                <col style="width:220px;">
                                <col>
                            </colgroup>
                            <tbody>
                                <tr>
                                    <td class="label">키워드</td>
                                    <td>
                                        <div>
                                            <input id="" name="" title="키워드" class="input_txt required _filter full" type="text" value="">
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label">특산물 소개</td>
                                    <td>
                                        <div class="flex_box col item-fend">
                                            <textarea id="" name="" title="상품설명" maxlength="" class="full"></textarea>
                                            <span>[0/200]</span>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label">상품 관리</td>
                                    <td>
                                        <div>
                                            <div class="flex_box gap-08 mb10">
                                                <button type="button" id="button_add_relation_item" class="btn btn-default btn-sm" onclick="findItem()"><span>${op:message('M00582')} <!-- 상품 추가 --> </span></button>
                                                <button type="button" class="btn btn-default btn-sm" onclick="Shop.deleteRelationItemAll('display')"><span>${op:message('M00411')} <!-- 전체삭제 --> </span></button>
                                            </div>
                                            
                                            <ul id="display" class="sortable_item_relation">
                                                <li style="display: none;"></li>
                                                
                                                <c:forEach items="${list}" var="item" varStatus="i">
                                                    <c:if test="${!empty item.itemId}">
                                                        <li id="display_item_${item.itemId}">
                                                            <input type="hidden" name="displayItemIds" value="${item.itemId}" />
                                                            <p class="image"><img src="${shop:loadImage(item.itemCode, item.itemImage, 'XS')}" class="item_image size-100 none" alt="상품이미지" /></p>
                                                            <p class="title">
                                                                <c:choose>
                                                                    <c:when test="${item.dataStatusCode == '1'}">
                                                                        <c:if test="${item.itemSoldOutFlag == 'Y'}"><strong style="color:red">[품절]</strong></c:if>
                                                                        <c:if test="${item.displayFlag == 'N'}"><strong style="color:red">[비공개]</strong></c:if>
                                                                    </c:when>
                                                                    <c:otherwise>
                                                                        <a href="javascript:Manager.itemLog('${item.itemId}')"><strong style="color:red">[비공개]</strong></a>		
                                                                    </c:otherwise>
                                                                </c:choose>
                                                                [${item.itemUserCode}] ${item.itemName}
                                                            </p>
                                                            
                                                            <span class="ordering">${i.count}</span>
                                                            <a href="javascript:Shop.deleteRelationItem('display_item_${item.itemId}');" class="delete_item_image">
                                                                <img src="../../content/opmanager/images/icon/icon_x.gif" alt="" />
                                                            </a>
                                                        </li>
                                                    </c:if>
                                                </c:forEach>
                                            </ul>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- // 조회 영역 -->

                    <div class="btn_all btn_center">
                        <div class="flex_box gap-08">
                            <button type="button" class="btn btn-dark-gray btn-small">저장</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- // 개발 영역 -->
</body>

</html>
