<body>
    <!-- 개발 영역 -->
    <div class="admin_wrap">
        <!-- 내용 -->
        <div id="container">

                <div class="contents_inner">
                    <div class="location">

                            <button type="button" class="btn btn-dark-gray btn-small">기탁서 양식 및 약관 출력</button>

                    </div>

                    <div class="board_write">
                        <table class="board_write_table" summary="">

                                <col style="width:220px;">
                            </colgroup>
                            <tbody>
                                <tr>
                                    <td class="label"><span class="required_mark">*</span>이름</td>
                                    <td>
                                        <div class="flex_box gap-08 item-center">
                                            <input id="" name="" title="이름" class="input_txt required _filter wd-150" type="text" value="">
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label"><span class="required_mark">*</span>주민등록번호</td>
                                    <td>
                                        <div class="flex_box gap-08 item-center">
                                            <input id="" name="" title="주민등록번호 앞자리" class="input_txt required _filter wd-150" type="text" value="">
                                            <span class="wave">-</span>
                                            <input id="" name="" title="주민등록번호 뒷자리" class="input_txt required _filter wd-150" type="text" value="">

                                            <button type="button" class="btn btn-default btn-mini"><span>실명인증</span></button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label"><span class="required_mark">*</span>휴대폰</td>
                                    <td>
                                        <div class="flex_box gap-08 item-center">
                                            <select id="" name="" title="선택" class="wd-100">
                                                <option value="">010</option>
                                            </select>
                                            <span class="wave">-</span>
                                            <input id="" name="" title="" class="input_txt required _filter wd-100" type="text">
                                            <span class="wave">-</span>
                                            <input id="" name="" title="" class="input_txt required _filter wd-100" type="text">
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label"><span class="required_mark">*</span>거주지 주소</td>
                                    <td>
                                        <div class="flex_box gap-08">
                                            <input id="" name="" title="" class="input_txt required _filter wd-150" type="text" disabled>
                                            <button type="button" class="btn btn-default btn-mini">주소찾기</button>
                                        </div>
                                        <div class="flex_box gap-08">
                                            <input id="" name="" title="" class="input_txt required _filter half" type="text" disabled>
                                            <input id="" name="" title="" class="input_txt required _filter half" type="text">
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label"><span class="required_mark">*</span>행정정보 공동이용 동의</td>
                                    <td>
                                        <div class="flex_box gap-12 item-center">
                                            <div class="input-form">
                                                <input id="rdo2-1" name="rdo2" type="radio" value="" checked="checked">
                                                <label for="rdo2-1">동의</label>
                                            </div>
                                            <div class="input-form">
                                                <input id="rdo2-2" name="rdo2" type="radio" value="">

                                            </div>
                                            <button type="button" class="btn btn-default btn-mini">주소검색</button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label"><span class="required_mark">*</span>기부자 행정지 주소</td>
                                    <td>
                                        <div class="flex_box gap-08 item-center">
                                            <select id="" name="" title="시도선택" class="wd-150" disabled>
                                                <option value="">시도선택</option>
                                            </select>
                                            <select id="" name="" title="시,구,군" class="wd-150" disabled>

                                            </select>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label"><span class="required_mark">*</span>기부 지자체</td>
                                    <td>
                                        <div class="flex_box gap-08 item-center">
                                            <select id="" name="" title="시도선택" class="wd-150">
                                                <option value="">시도선택</option>
                                            </select>
                                            <select id="" name="" title="시,구,군" class="wd-150">
                                                <option value="">시,구,군</option>
                                            </select>
                                        </div>
                                    </td>
                                </tr>

                                            <button type="button" class="btn btn-default btn-mini">한도체크</button>
                                            <span class="wave tip">* 일년에 최대 5백만원까지 기부가 가능합니다.</span>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="label"><span class="required_mark">*</span>답례품</td>
                                    <td>
                                        <div class="flex_box gap-12 item-center">
                                            <div class="input-form">
                                                <input id="rdo1-1" name="rdo1" type="radio" value="" checked="checked">
                                                <label for="rdo1-1">답례품을 제공 받음</label>
                                            </div>
                                            <div class="input-form">
                                                <input id="rdo1-2" name="rdo1" type="radio" value="">
                                                <label for="rdo1-2">답례품을 제공 받지 않음</label>
                                            </div>
                                        </div>
                                    </td>
                                </tr>

                                            </div>
                                        </div>
                                    </td>
