<body>
    <!-- 개발 영역 -->
    <!-- 기부금 지출내역 popup -->
    <div class="popup_wrap">
        <div id="pop_header">
            <h1 class="popup_title">기부금 지출내역</h1>
			<a href="javascript:self.close();" class="btn_close"><img src="../../content/opmanager/images/btn/btn_close.png" alt="닫기"></a>
		</div>

        <div class="popup_contents">
            <div>
                <div class="board_write">
                    <table class="board_write_table" summary="">
                        <colgroup>
                            <col style="width:220px;">
                        </colgroup>
                        <tbody>
                            <tr>
                                <td class="label"><span class="required_mark">*</span>지출일자</td>
                                <td>
                                    <div>
                                        <span class="datepicker">
                                            <input id="searchStartDate" name="searchStartDate" title=""
                                                class="datepicker hasDatepicker" type="text" value="" maxlength="8"
                                                autocomplete="off">
                                            <button type="button" class="ui-datepicker-trigger">
                                                <span class="icon_calendar">날짜 선택</span>
                                            </button>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label"><span class="required_mark">*</span>사업명</td>
                                <td>
                                    <div>
                                        <input id="" name="" title="" class="input_txt required _filter wd-500" type="text" value="태풍 난마돌 구호">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label"><span class="required_mark">*</span>지출사업목적</td>
                                <td>
                                    <div class="flex_box gap-08 item-center">
                                        <select id="" name="" title="지출사업목적" class="wd-500">
                                            <option value="">재난구호물품 구입</option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label"><span class="required_mark">*</span>사용금액</td>
                                <td>
                                    <div class="flex_box gap-08 item-center">
                                        <input id="" name="" title="" class="input_txt required _filter wd-500 text-right" type="text" value="10,000,000">
                                        <span class="wave">원</span>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label"><span class="required_mark">*</span>사용내용</td>
                                <td>
                                    <div>
                                        <span class="placeholder_wrap">
                                            <span class="placeholder">placeholder</span>
                                            <textarea id="comments" name="comments" cols="30" rows="10" maxlength="140" class="required _filter wd-500" title="사용내용"></textarea>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label">비고</td>
                                <td>
                                    <div>
                                        <input id="" name="" title="" class="input_txt required _filter wd-500" type="text">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label">증빙서류</td>
                                <td>
                                    <div class="flex_box item-center">
                                        <input type="file" name="" class="full input_file" title="이미지" multiple="multiple" accept="image/png, image/jpeg, image/gif" />
                                    </div>

                                    <div class="file_camera">
                                        <a href="" class="txt_line">지출영수증.jpg</a>
                                        <a href=""><img src="../../content/images/btn/file_close.gif" alt="close"></a>
                                    </div>
                                    <div class="file_camera">
                                        <a href="" class="txt_line">지출내역확인서.hwp</a>
                                        <a href=""><img src="../../content/images/btn/file_close.gif" alt="close"></a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p class="popup_btns">
                    <div class="btn_all btn_center">
                        <div class="btn_left gap-08">
                            <button type="button" class="btn btn-active">수정</button>
                            <button type="button" class="btn btn-default">취소</button>
                            <button type="button" class="btn btn-active">삭제</button>
                        </div>
                    </div>
                </p>
            </div>
        </div>
    </div>
