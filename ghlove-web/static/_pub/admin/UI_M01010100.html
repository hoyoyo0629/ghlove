                            <h2 class="top_tit">인증서 로그인</h2>
                            <!-- // 20230322 수정 -->
                        </div>
                        <div class="cont_area">
                            <div class="button_wrap">
                                <button type="button" class="btn btn-dark-gray"><span>금융인증서</span></button>

                        </div>
                    </div>

                    <div class="login_form pwd">

                            <div class="flex_box mb15">

                                    <input type="password" name="op_password" maxlength="20" class="required"
                                        title="${op:message('M00150')}" placeholder="비밀번호" />
                                </div>
                                <div class="button_wrap">
                                    <button type="button" class="btn btn-default btn-lg"><span>로그인</span></button>
                                    <!-- 로그인 ログイン -->
                                </div>
                            </div>
                            <div class="checkbox">
                                <input type="checkbox" id="chk">
                                <label for="chk">아이디 저장</label>
                            </div>
                        </div>
                    </div>
