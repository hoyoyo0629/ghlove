<body>
    <!-- 개발 영역 -->
    <div class="admin_wrap">
        <!-- 내용 -->
        <div id="container">
            <div class="contents">
                <div class="contents_inner">
                    <div class="location">
                        <a href="#">답례품 관리</a> &gt; <a href="#">대표상품관리</a>

                    <div class="item_list">
                        <h3><span>대표상품관리</span></h3>

                        <!-- 조회 조건 테이블 -->
                        <div class="board_write">
                            <table class="board_write_table" summary="상품승인관리">
                                <caption>상품승인관리</caption>
                                <colgroup>
                                    <col style="width: 220px" />
                                    <col>
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <td class="label">지자체</td>
                                        <td>
                                            <div class="flex_box gap-08 item-center">
                                                <select id="" name="" title="시도선택" class="wd-150">
                                                    <option value="">시,도 선택</option>
                                                </select>
                                                <select id="" name="" title="시,구,군" class="wd-150">
                                                    <option value="">시,구,군</option>
                                                </select>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="label">카테고리</td>

                                            <div class="flex_box gap-08">
                                                <select id="" name="" title="카테고리" class="wd-150">
                                                    <option value="">전체</option>
                                                </select>
                                                <select id="" name="" title="카테고리" class="wd-150">
                                                    <option value="">2차 카테고리</option>
                                                </select>
                                                <select id="" name="" title="카테고리" class="wd-150">
                                                    <option value="">3차 카테고리</option>
                                                </select>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="label">검색구분</td>
                                        <td>
                                            <div class="flex_box gap-08">
                                                <select id="" name="" title="검색구분" class="wd-150">
                                                    <option value="">전체</option>
                                                    <option value="">상품명</option>
                                                </select>
                                                <input id="" name="" title="검색구분"
                                                    class="input_txt required _filter full" type="text" value="">
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div> <!-- // board_write -->
                        <!-- // 조회 조건 테이블 -->

                        <div class="btn_all btn_right">
                            <div class="flex_box gap-08">
                                <button type="button" class="btn btn-dark-gray btn-mini"
                                    onclick="location.href='/opmanager/item/seller/list';">초기화</button>
                                <button type="submit" class="btn btn-dark-gray btn-mini">검색</button>
                            </div>
                        </div>

                        <div class="count_title mt-40">
                            <h5>총 545,423건</h5>
                            <span>
                                <select id="" name="" title="화면출력수">
                                    <option value="10" selected="selected">10개 출력</option>
                                    <option value="20">20개 출력</option>
                                    <option value="50">50개 출력</option>
                                    <option value="100">100개 출력</option>
                                </select>
                            </span>
                        </div>

                        <!-- 조회 결과 테이블 -->
                        <div class="board_list">
                            <form id="listForm">
                                <input type="hidden" id="processType" name="processType" />
                                <input type="hidden" id="approvalMessage" name="approvalMessage" />
                                <table class="board_list_table" summary="상품승인관리리스트">
                                    <caption>상품승인관리리스트</caption>
                                    <colgroup>
                                        <col style="width:50px;">
                                        <col style="width:50px;">
                                        <col style="width:200px;">
                                        <col style="width:500px;">
                                        <col style="width:200px;">
                                        <col style="width:150px;">
                                        <col style="width:100px;">
                                        <col style="width:100px;">
                                        <col style="width:200px;">
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th><input type="checkbox" id="check_all" title="체크박스" /></th>

                                            <th>상품명</th>
                                            <th>판매가</th>
                                            <th>상호명</th>
                                            <th>상태</th>
                                            <th>공개유무</th>
                                            <th>등록일</th>
                                        </tr>
                                    </thead>
                                    <tbody class="sortable">
                                        <tr>
                                            <!-- 체크박스 -->
                                            <td>
                                                <div>
                                                    <input type="checkbox" name="" value="" id="">
                                                </div>
                                            </td>
                                            <!-- // 체크박스 -->
                                            <!-- No. -->
                                            <td>
                                                <div>1</div>
                                            </td>
                                            <!-- // No. -->
                                            <!-- 지자체 -->
                                            <td>
                                                <div>서울시 종로구</div>
                                            </td>
                                            <!-- // 지자체 -->
                                            <!-- 상품명 -->
                                            <td class="left break-word">
                                                <a href="javascript:Link.view('/opmanager/item/seller/edit/${item.itemUserCode}')" class="break-word">
                                                    <div class="flex_box item-center gap-08">
                                                        <img src="../../content/images/common/item_223-2.jpg" class="item_image" alt="상품명이미지" />
                                                        <div>${item.itemName}</div>
                                                    </div>
                                                </a>
                                            </td>
                                            <!-- // 상품명 -->
                                            <!-- 판매가 -->
                                            <td>
                                                <div>30,000</div>
                                            </td>
                                            <!-- // 판매가 -->
                                            <!-- 상호명 -->
                                            <td>
                                                <div>asdfasdf</div>
                                            </td>
                                            <!-- // 상호명 -->
                                            <!-- 상태 -->
                                            <td>
                                                <div>판매중</div>
                                            </td>
                                            <!-- // 상태 -->
                                            <!-- 공개유무 -->
                                            <td>
                                                <div>공개</div>
                                            </td>
                                            <!-- // 공개유무 -->
                                            <!-- 등록일 -->
                                            <td>
                                                <div>2022-11-16</div>
                                            </td>
                                            <!-- // 등록일 -->
                                        </tr>
                                    </tbody>
                                </table>
                            </form>

                            <c:if test="${empty list}">
                                <div class="no_content">
                                    ${op:message('M00473')}
                                    <!-- 데이터가 없습니다. -->
                                </div>
                            </c:if>

                            <div class="btn_all btn_right">
                                <div class="flex_box gap-08">
