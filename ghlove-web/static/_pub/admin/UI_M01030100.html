<body>
    <!-- 개발 영역 -->
    <!-- 관리자 비밀번호 변경안내(3개월) popup -->
    <div class="popup_wrap">
        <div id="pop_header">
            <h1 class="popup_title">관리자 비밀번호 변경안내(3개월)</h1>
			<a href="javascript:self.close();" class="btn_close"><img src="../../content/opmanager/images/btn/btn_close.png" alt="닫기"></a>
		</div>

        <div class="popup_contents">
            <div class="flex_box col item-center">
                <p class="txt mb20 txt_center">관리자정보관리 정책에 따라<br><span class="point">3개월마다</span> 비밀번호를 변경하셔야<br>관리자 로그인이 가능합니다.</p>

                <div class="board_write">
                    <table class="board_write_table" summary="">
                        <colgroup>
                            <col style="width:150px;">
                        </colgroup>
                        <tbody>
                            <tr> 
                                <td class="label">현재 비밀번호</td>
                                <td>
                                    <div class="flex_box gap-08">
                                        <input id="" name="" title="현재 비밀번호" class="input_txt required _filter full" type="password" value="">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label">새 비밀번호</td>
                                <td>
                                    <div class="flex_box gap-08">
                                        <input id="" name="" title="새 비밀번호" class="input_txt required _filter full" type="password" value="">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="label">새 비밀번호 확인</td>
                                <td>
                                    <div class="flex_box gap-08">
                                        <input id="" name="" title="새 비밀번호 확인" class="input_txt required _filter full" type="password" value="">
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <ul class="list-bullet mt15">
                    <li>9 ~ 20자 영문, 숫자, 특수문자를 사용하세요. (3개 이상의 연속된 문자나 숫자 사용불가)</li>
                    <li>아이디를 포함할 수 없습니다.</li>
                </ul>

                <p class="popup_btns">
                    <button type="button" class="btn btn-dark-gray">변경하기</button>
                </p>
            </div>

        </div>
    </div>
    <!-- // 관리자 비밀번호 변경안내(3개월) popup -->
    <!-- // 개발 영역 -->
