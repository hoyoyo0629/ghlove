            <div class="overlayer-header" style="font-size: 26px; height: 60px; line-height: 60px; padding: 0">지자체 선택</div>
            <div class="overlayer-body" style="padding-top: 30px; border-radius: 0 0 15px 15px">

            </div>
            <div class="btn-box">
              <button
                type="button"
                class="temp-button hidden_txt"

                @click="closeMapSelect()"

                지자체 선택 팝업 닫기

      <section class="main_contents">
      	<!-- 고객 요청 : 포인트 카테고리 배너 제거, 상단 타이틀 추가 -->
        <!-- banner Image -->
        <div class="main_banner center" v-if="representativeBanners != '' && !exportMode && isItemMain">
          <div class="swiper-button-prev pc" slot="button-prev"><span class="screen_out">이전슬라이드</span></div>
          <swiper class="main_slider" :options="swiperOption.mainSlider" @click.native="goBannerPage" ref="awesomeNewSwiper">
            <swiper-slide v-for="(data, i) in representativeBanners" :key="i"
              ><!-- click event, a tag 사용시 함수 사용 불가... -->
              <button type="button" tabindex="0" @click="goBannerPageFn" :title="data.title + ' 이동'">
                <img class="de-img" :src="itemImage(data.imageSrcPc)" :alt="data.bannerContent" @error="errorImage($event)" />
                <img class="mo-img" :src="itemImage(data.imageSrcMobile)" :alt="data.bannerContent" @error="errorImage($event)" />
                <!-- <img class="de-img" :src="itemImage(data.imageSrcPc)" :alt="data.title">
                            <img class="mo-img" :src="itemImage(data.imageSrcMobile)" :alt="data.title"> -->
              </button>
            </swiper-slide>
          </swiper>
          <div class="swiper-button-next pc" slot="button-next"><span class="screen_out">다음슬라이드</span></div>

          <div class="swiper-control">
            <div class="stop_resume">
              <button type="button" v-if="autoSlide" @click="stopAutoSlide">
                <img class="icon-img" src="/static/images/icon/pause.png" alt="일시정지" />
              </button>
              <button type="button" v-else @click="resumeAutoSlide"><img class="icon-img" src="/static/images/icon/play.png" alt="재생" /></button>
            </div>
            <div class="swiper-pagination" slot="pagination"></div>
          </div>
        </div>
        <!-- //banner Image -->
        <section class="page-title-box mall center" v-if="!isItemMain">
	        <span class="ali_breadcrumb">
	          <a href="/" v-if="!exportMode"><img class="icon-img" src="/static/images/icon/cli-icon_home.png" alt="홈으로" /></a>
            <span class="txt-arrow" v-if="!exportMode"><span class="sr-only">></span></span>
	          <span @click.prevent="this.$s.redirect('/goods/index.html')" style="cursor: pointer" v-if="!exportMode">답례품</span>
	          <span @click.prevent="this.$s.redirect('/goods/index.html?exportMode=true')" style="cursor: pointer" v-if="exportMode">답례품</span>
	          <span class="txt-arrow"><span class="sr-only">></span></span>
            <span
              @click.prevent="searchPrice(`${nowPointCategoryValue}`)"
              style="cursor: pointer"
              >{{ pointCategory.find(point => point.price === nowPointCategoryValue)?.title }}</span
            >
	        </span>
	        <h2 class="page-title-txt"> {{ pointCategory.find(point => point.price === nowPointCategoryValue)?.title }} </h2>
	      </section>

        <div class="center" id="itemArea">
          <div class="section condi_section">
            <!--  카테고리별 | 포인트별 조회 -->
            <div class="category_group">
              <ul class="condition_list">
                <li v-for="(categoryGroup, i) in category.groups" :key="i">
                  <button :class="categoryGroup.url === group ? 'on' : ''" @click.prevent="searchSelfCategoryGroup(categoryGroup.url)">
                    <span class="icon_img">
                      <img class="de-img" v-bind:src="categoryGroup.description" alt="" />
                      <!-- :alt="categoryGroup.name"> -->
                      <img class="mo-img" v-bind:src="categoryGroup.descriptionM" alt="" />
                      <!-- :alt="categoryGroup.name"> -->
                    </span>
                    <span class="icon_txt">{{ categoryGroup.name }}</span>
                  </button>
                </li>
                <li>
                  <button type="button" class="pointCon" @click.prevent="searchPrice(10000)" :class="price == 10000 ? 'on' : ''">
                    <span class="icon_img">
                      <img src="/static/images/goods/cli-icon_amount01.png" alt="" />
                    </span>
                    <span class="icon_txt">1만 포인트 이하</span>
                  </button>
                </li>
                <li>
                  <button type="button" class="pointCon" @click.prevent="searchPrice(30000)" :class="price == 30000 ? 'on' : ''">
                    <span class="icon_img">
                      <img src="/static/images/goods/cli-icon_amount02.png" alt="" />
                    </span>
                    <span class="icon_txt">3만 포인트 이하</span>
                  </button>
                </li>
                <li>
                  <button type="button" class="pointCon" @click.prevent="searchPrice(50000)" :class="price == 50000 ? 'on' : ''">
                    <span class="icon_img">
                      <img src="/static/images/goods/cli-icon_amount03.png" alt="" />
                    </span>
                    <span class="icon_txt">5만 포인트 이하</span>
                  </button>
                </li>
                <li>
                  <button type="button" class="pointCon" @click.prevent="searchPrice(50001)" :class="price == 50001 ? 'on' : ''">
                    <span class="icon_img">
                      <img src="/static/images/goods/cli-icon_amount04.png" alt="" />
                    </span>
                    <span class="icon_txt">5만 포인트 이상</span>
                  </button>
                </li>
              </ul>
            </div>
          </div>
          <!-- // 카테고리별 | 포인트별 조회 -->

          <div class="section all_goods" id="contents">
            <ul class="goods-list-group">
              <li class="goods-list-items" v-for="(val,i) in goodsCard" :key="i">
                <div class="list_inner">
                  <span class="img_frame">
                    <a
                      @click.prevent="jumpToDetails(val)"
                      class="img_cover_link"
                      tabindex="0"
                      @keydown="jumpToDetailsE($event,val)"
                    >
                      <img class="item_img" v-bind:src="itemImage(val.itemImage)" :alt="val.itemName" @error="this.$goodsItem.errorImage($event)" />
                      <img
                        src="/static/images/goods/goods_sold-out.png"
                        alt="품절"
                        v-show="!(val.adultItemYn === 'Y' && adultYn === 'N') && val.itemSoldOutFlag === 'Y'"
                      />
                      <img src="/static/images/goods/goods_19.png" alt="19세구매가능" v-show="val.adultItemYn === 'Y' && adultYn === 'N'" />
                    </a>

                    <button
                      type="button"
                      class="icon-md-img hidden_txt"
                      :class="val.wishlistFlag ? 'on' : ''"
                      @click.prevent="this.$goodsItem.addToWishList($event)"
                      @keydown="keydownDetails($event)"
                      v-bind:id="val.itemId"
                      :aria-label="val.wishlistFlag ? '관심 답례품 등록 상태, 해제하기' : '관심 답례품 해제 상태, 등록하기'"
                      v-if="!exportMode"
                    >
                      관심답례품
                    </button>
                    <!--관심답례품 아이콘 상태 토글-->
                    <!-- 26.03.24 필수 추가정보 기능 추가에 의해 장바구니 버튼 삭제(이유: 검색엔진 수정 필요) -->
                    <!--<button
                      type="button"
                      class="cart hidden_txt"
                      @keydown="keydownDetails($event)"
                      @click.stop="this.$goodsItem.addToCart(val.itemId, val.adultItemYn, buyFlag, 'item-' + val.itemId)"
                      style="cursor: pointer"
                      v-if="this.$goodsItem.isShowCartIcon(val) && !exportMode"
                      :id="'item-' + val.itemId"
                      aria-label="장바구니에 추가"
                    >
                      장바구니
                    </button>-->
                  </span>
                  <button type="button" class="do_btn" @click.stop="this.$goodsItem.getLocGovInfo(val.locgovCode)" v-if="!exportMode">
                    <span class="btn_icon"></span>
                    <span class="btn_txt">{{ val.locgovNm }} 기부</span>
                    <span class="btn_arrow"></span>
                  </button>
                  <a @click.prevent="jumpToDetails(val)"
                  tabindex="0"
                  @keydown.enter.space="jumpToDetails(val)" class="card_title" :class="{ 'grayTxt_so' :  val.itemSoldOutFlag === 'Y' }" v-html="val.itemName"></a>
                  <span class="deepBlue" :class="{ 'grayTxt_so' :  val.itemSoldOutFlag === 'Y' }"
                    ><span class="pointSize">{{ formatNumber(val.salePrice) }}</span> P</span
                  >

                  <span class="tag_box" v-if="val.itemNewFlag == 'Y'">신규</span>
                </div>
              </li>
            </ul>
            <!-- <div class="btn-box moreBtn" v-show="moreBtnDisplay">
                        <button class="formBtn more" type="button" v-on:click="nextPage()">더보기</button>
                    </div> -->
            <!-- <pagination :current-page="result.currentPage" :total-pages="result.totalPages" @change="paging" v-if="!isNoData"></pagination> -->
            <pagination :current-page="itemListPage" :total-pages="totalPage" @change="paging"></pagination>
          </div>
        </div>
      </section>
      <layout-fixed-btn v-if="!exportMode"></layout-fixed-btn>
      <layout-tabbar-ali
        ref="layoutHeaderSearchMobile"
        :menu-url="menuUrl"
        @show-map-select="showMapSelect"
        :export-mode="exportMode"
      ></layout-tabbar-ali>
      <layout-footer-ali ref="layoutFooter" @loading-mounted="loadingMounted" :export-mode="exportMode"></layout-footer-ali>

    <!-- JavaScript -->
    <script src="/static/js/jquery-3.4.1.min.js"></script>

    <script src="/static/js/footer.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/jquery.cookie.js"></script>

    <script src="/modules/es6-promise.min.js"></script>
    <script src="/modules/es6-promise.auto.min.js"></script>
    <script src="/modules/axios.js"></script>
    <script src="/modules/vue.js"></script>
    <script src="/modules/httpVueLoader.js"></script>
    <script src="/modules/op.config.js"></script>
    <script src="/modules/op.saleson.js"></script>
    <script src="/modules/op.common.js"></script>
    <script src="/modules/op.wcslog.js"></script>

    <script type="text/babel" src="/modules/op.vue.js"></script>
    <script type="text/babel">
      Vue.use(VueAwesomeSwiper);
      var vm = new Vue({
        el: "#saleson",
        components: {
          "layout-header-ali": httpVueLoader("/components/layouts/header_ali.vue"),
          "layout-header": httpVueLoader("/components/layouts/header_g.vue"),
          "layout-fixed-btn": httpVueLoader("/components/ui/fixedBtn.vue"),

          "layout-footer-ali": httpVueLoader("/components/layouts/footer_ali.vue"),
          "layout-tabbar-ali": httpVueLoader("/components/layouts/m_tabbar_g.vue"),
          pagination: httpVueLoader("/components/ui/pagination_lclgv_mall.vue"), //pagination

          "layout-map-select": httpVueLoader("/components/ui/lclgv_chc/map.vue"),
        },
        data: {
          totalSerchCnt: 0,
          goodsCard: [],
          category: {
            groups: [],
          },
          param: {
            arrayRequiredItems: [],
          },
          promotion: {
            displayImageList: [],
          },
          featured: {
            displayImageList: [],
          },
          mdItems: [],
          newItems: [],
          groupBestItems: [],
          firstGroupBestUrl: "",
          event: [],
          styleBooks: [],
          itemListPage: 0,
          totalPage: 0,
          swiperOption: {
            mainSlider: {
              centeredSlides: true,
              slidesPerView: "auto",
              spaceBetween: 60,
              autoplay: {
                disableOnInteraction: false, // 드래그하여 슬라이드 넘길경우 멈추지 않게 하기 위함
              },
              loop: true,
              pagination: {
                el: ".main_banner .swiper-pagination",
                type: "fraction",
                // renderBullet: function (index, className) {
                //     return '<span class="' + className + '">' + (index + 1) + "</span>";
                // },
              },
              navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
              },
              grabCursor: true,
            },
            mdSlider: {
              slidesPerView: 4,
              spaceBetween: 30,
              centerSlides: true,
              navigation: {
                nextEl: ".md_section .swiper-button-next",
                prevEl: ".md_section .swiper-button-prev",
              },
              breakpoints: {
                767: {
                  slidesPerView: 2,
                  spaceBetween: 16,
                },
              },
              grabCursor: true,
            },
            newSlider: {
              slidesPerView: "auto",
              centerSlides: true,
            },
            bestSlider: {
              slidesPerView: "auto",
              resistance: true,
              resistanceRatio: 0,
              freeMode: true,
            },
          },
          representativeBanners: [],
          moreBtnDisplay: false,
          // 헤더 검색용
          menuUrl: location.pathname,
          sidoList: [],
          sigunguList: [{ cityCode: "", cityName: "시·군·구 선택" }],
          selectedSido: "",
          selectedSigungu: "",
          // 헤더 검색용
          adultYn: "N",
		  // 장바구니 담기금지 플래그
		  buyFlag: 'Y',
          price: "",
          group: "",
          displayBannerIdx: 0,
          totalBannerCnt: 0,
          isMobile: $s.isMobile(),
          autoSlide: true,
          exportMode: false,
					isItemMain: false,
					pointCategory: [
							{
								title : '1만 포인트 이하',
								price : 10000
							},
							{
								title : '3만 포인트 이하',
								price : 30000
							},
							{
								title : '5만 포인트 이하',
								price : 50000
							},
							{
								title : '5만 포인트 이상',
								price : 50001
							},
						],
						nowPointCategoryValue: 0,
        },
        methods: {
          jumpToDetails: function (v) {
            if (v.adultItemYn === "Y" && this.adultYn === "N") {
              if ($s.isLogin()) {
                $s.alert("19세 미만의 청소년은 이용할 수 없습니다.");
              } else {
                $s.redirect($s.pages.LOGIN + "?target=" + encodeURIComponent($s.requestContext.requestFullUri));
              }
              return;
            }
            if (this.exportMode) {
              $s.redirect("/items/details.html?code=" + v.itemUserCode + "&exportMode=" + this.exportMode);
            } else {
              $s.redirect("/items/details.html?code=" + v.itemUserCode);
            }
          },
          jumpToDetailsE(e, v) {
            if (e.keyCode === 13 || e.keyCode === 32) {
              this.jumpToDetails(v);
            }
          },
          keydownDetails(e) {
            if (e.keyCode === 13 || e.keyCode === 32) {
              if ($(e.target).parents().is(".list_inner")) {
                e.stopPropagation();
              }
            }
          },
          getItemList: function (isFirst) {
            if (!this.itemListPage) {
              this.itemListPage = 1;
            }
            let param = {
              page: this.itemListPage,
              categoryCode: "ALL",
              itemsPerPage: $goods.const.ITEMS_PER_GOODS,
              keyword: "",
              searchGbn: this.type,
              group: this.group,
              price: this.price ? this.price : "0",
            };
            this.showMoreBtn(false);
            vm.showLoading(true);
            vm.goodsCard = [];
            $s.api.getItemsNew(
              param,
              function (response) {
                vm.showLoading(false);
                let content = response.content;

                if (content) {
                  try {
                    vm.totalPage = response.totalPages;
                    let size = content.length;
                    if (size == 0) {
                      vm.totalSerchCnt = 0;
                      vm.adultYn = "N";
                      $s.alert("검색결과가 없습니다.");
                      return;
                    } else {
                      if (response.currentPage < response.totalPages) {
                        vm.showMoreBtn(true);
                      }
                    }

                    // vm.adultYn = response.adultYn;       // 19세 답례품 모두 보여주는 걸로 변경되어 수정
					vm.buyFlag = response.adultYn;
                    vm.adultYn = "Y";

                    for (let i = 0; i < size; i++) {
                      let itemInfo = content[i];
                      vm.goodsCard.push(itemInfo);
                    }

                    if (!isFirst) {
                      location.href = "#itemArea";
                    }
                  } catch (e) {
                    $s.alert("잠시 후 시도해 주세요.");
                  }
                } else {
                  vm.totalPage = 0;
                  vm.totalSerchCnt = 0;
                  $s.alert("검색결과가 없습니다.");
                }
              },
              function (error) {
                vm.showLoading(false);
                //$s.api.handleApiExeption(error);
                $s.alert(error.response.data.message, function () {
                  vm.historyBack();
                  $s.closeAlert();
                });
                // modal alert 바깥영역 클릭해도 이전페이지로 이동
                $("#saleson").on("click", "#op-alert", function () {
                  vm.historyBack();
                });
              }
            );
          },
          historyBack: function () {
            if (history.length == 1) {
              $s.redirect("/");
            } else {
              history.back();
            }
          },
          paging: function (page, pageTarget) {
            if (this.itemListPage == page) {
              return;
            }
            this.itemListPage = page;
            this.getItemList();
          },
          getRepresentativeBanners: function () {
            let params = { processType: "ITEM" };
            $s.api.getRepresentativeBanners(params, function (response) {
              vm.representativeBanners = response.list;

              setTimeout(function () {
                try {
                  if (vm.representativeBanners.length < 2) {
                    vm.stopAutoSlide();
                  }
                  let realIndex = vm.$refs.awesomeNewSwiper.swiper.realIndex;
                  if (realIndex != NaN) {
                    vm.displayBannerIdx = realIndex + 1;
                  }

                  let loopedSlides = vm.$refs.awesomeNewSwiper.swiper.loopedSlides;
                  if (loopedSlides != NaN) {
                    vm.totalBannerCnt = loopedSlides;
                  }

                  vm.$refs.awesomeNewSwiper.swiper.eventsListeners.activeIndexChange.push(function () {
                    let activeIdx = vm.$refs.awesomeNewSwiper.swiper.realIndex;
                    if (activeIdx != NaN) {
                      vm.displayBannerIdx = activeIdx + 1;
                    }
                  });
                } catch (e) {
                  $s.error();
                }
              }, 10);
            });
          },
          goBannerPage: function () {
            try {
              // swiper-slide-duplicate-active 클래스 찾아서 해당 인덱스 값으로 url 찾음
              $s.redirect(this.representativeBanners[$(".swiper-slide-duplicate-active").attr("data-swiper-slide-index")].linkUrl);
            } catch (e) {
              $s.error();
            }
          },
          goBannerPageFn() {
            this.goBannerPage();
          },

          nextPage: function () {
            this.itemListPage++;
            this.getItemList();
          },
          showLoading: function (isLoading) {
            this.$refs.layoutFooter.showLoading(isLoading);
          },
          showMoreBtn: function (isShow) {
            this.moreBtnDisplay = isShow;
          },
          initCallFunction: function () {
            this.getItemList(true);
            this.getRepresentativeBanners();
          },
          searchSelfCategoryGroup: function (group) {
            if (this.exportMode) {
              $s.redirect(`/goods/searchGoods.html?group=${group}&type=C&exportMode=` + this.exportMode);
            } else {
              $s.redirect(`/goods/searchGoods.html?group=${group}&type=C`);
            }
          },
          searchPrice: function (price) {
            if (this.exportMode) {
              $s.redirect(`/goods/index.html?price=${price}&exportMode=` + this.exportMode);
            } else {
              $s.redirect(`/goods/index.html?price=${price}`);
            }
          },
          loadingMounted: function () {
            this.initCallFunction();
          },
          resumeAutoSlide: function () {
            setTimeout(function () {
              vm.$refs.awesomeNewSwiper.swiper.autoplay.start();
            }, 10);
            vm.autoSlide = true;
          },
          stopAutoSlide: function () {
            setTimeout(function () {
              vm.$refs.awesomeNewSwiper.swiper.autoplay.stop();
            }, 10);
            vm.autoSlide = false;
          },
          selectLclgvPc: function (lclgvUpperCd, lclgvCd, lclgvUpperNm, lclgvNm) {
            this.$refs.layoutHeaderSearchPc.searchLocgovMap(lclgvUpperCd, lclgvCd, lclgvUpperNm, lclgvNm);
            this.closeMapSelect();
          },
          selectLclgvMo: function (lclgvUpperCd, lclgvCd, lclgvUpperNm, lclgvNm) {
            this.$refs.layoutHeaderSearchMobile.searchLocgovMap(lclgvUpperCd, lclgvCd, lclgvUpperNm, lclgvNm);
            this.closeMapSelect();
          },
          showMapSelect: function () {
            this.$refs.getParentModal.setAttribute("style", "display: block;top: 0;");
          },
          closeMapSelect: function () {
            this.$refs.getParentModal.removeAttribute("style");
          },
					urlCheck() {
						const param = new URLSearchParams(window.location.search);
						const price = param.get('price');
						if(price === null || price === undefined) {
							this.isItemMain = true;
						} else {
							this.nowPointCategoryValue = Number(price);
						}
					},
        },
        // watch: {
        //     displayBannerIdx: function (newValue) {
        //         console.log(newValue);
        //     }
        // },
        computed: {
          topBanners: function () {
            return this.promotion.displayImageList;
          },
          newSwiper: function () {
            return this.$refs.awesomeNewSwiper.swiper;
          },
        },
        created: function () {},
        mounted: function () {
          this.$nextTick(function () {
            //Saleson.init({loginPage:true});
            Saleson.init();
            this.itemListPage = 0;
            this.categoryInfo(this);
            this.price = $s.core.getParameter("price");
            this.group = $s.core.getParameter("group");
            this.type = this.price || this.group ? "C" : "T";
            this.exportMode = $s.core.getParameter("exportMode") == "true" ? true : false;
						this.urlCheck();
          });
        },
      });
    </script>
  </body>
</html>
