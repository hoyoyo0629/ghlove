function GetFSWErrorNumber()
{
	var param = window.location.href;
	
	var pos1 = param.indexOf("?");
	
	if ( pos1 == -1 )
		return "-1";

	param = param.substr(pos1+1);
	
	pos1 = param.indexOf("errNo=");
	if ( pos1 == -1 )
		return "-1";
	
	pos1 += 6;	// errNo=
	var pos2 = param.indexOf("&", pos1);

	if ( pos2 == 0 )
		return "-1";
		
	if ( pos2 == -1 )
		pos2 = param.length;
	
	if ( pos1 == pos2 )
		return "-1";
		
	return param.substring(pos1, pos2);
}

function SelectGuide(Language, ErrNum)

	switch (ErrNum)

		case '-6':

		break;

		break;					
		
		case '33':

		case '55':

		break;

		break;
		
		case '901':

		break;
		
	}
	
	if(Language == "ko"){
		window.location.href = guideUrl + "?errNo=" + ErrNum;
	}else{
		window.location.href = "en_" + guideUrl + "?errNo=" + ErrNum;
	}
}
