			<h1><img src="../images/img_h1.png" alt="Fasoo"/></h1>

	</div>
	<div class="content">

			<h3>1. Click "Install".</h3>

				<span class="btn_base"><a id="linkSetup" onclick="SetupDownloadBtn()"><button onclick="linkSetup.click()">Install</button></a></span>
				<br><br>Please re-start the browser after installation.<br>
				<br>
				<span class="ac_text" style="margin-top: 10px;">> Click "Run".</span>
				<img id="imgExecuteBtn"/>
				<br>
				<span class="ac_text" style="margin-top: 10px;">> Click "Yes" upon installation.</span>
				<img id="imgInstall_rebooting"/>

		    <h3 id="helpdesk_guide_menu"></h3>

<footer>
<script language=javascript>
function DispGuideChangeUI()
{
    var imgExecuteBtn = document.getElementById("imgExecuteBtn");  
    var imgInstall_rebooting = document.getElementById("imgInstall_rebooting");    
    
    if (GetOSName() != "Windows")
    {
        imgExecuteBtn.innerHTML = GetOSName() + " <br> Not Support OS ! ";       
        return;
    }

  var Agent = navigator.userAgent.toLowerCase();
	if(Agent.indexOf("msie") > -1 || Agent.indexOf("trident") > -1) //Internet Explorer
	{
    if (GetOSVersion() == "XP")
    {
        imgExecuteBtn.src = "../images/en_install_task_bar_execute_xp.jpg";
        imgInstall_rebooting.src = "../images/en_install_rebooting_xp.jpg";                     
    }
	else if(GetOSVersion()== "10")
	{
		imgExecuteBtn.src = "../images/en_install_task_bar_execute_win7.jpg";
        imgInstall_rebooting.src = "../images/en_install_rebooting_win10.jpg";
	}
    else
    {
        imgExecuteBtn.src = "../images/en_install_task_bar_execute_win7.jpg";
        imgInstall_rebooting.src = "../images/en_install_rebooting_win7.jpg";             
    }
  }
  else //타 브라우저
  {
    imgExecuteBtn.src = "../images/install_task_bar_execute_plugin.jpg";
    imgInstall_rebooting.src = "../images/install_rebooting_plugin.jpg";             
  }
}

function SetLinkSetupFile()
{
  var setupLink = document.getElementById("linkSetup");
  var setupObj = document.getElementById("installobj");

  if (GetWindowsBitType() == "32")
    ClientSetupExeUrl = ClientSetupExe32Url;
  else
    ClientSetupExeUrl = ClientSetupExe64Url;

  setupLink.href = ClientSetupExeUrl;
}

DispGuideChangeUI();   
SetLinkSetupFile(); 
</script>
</footer>
