<script language=javascript>
function DispGuideChangeUI()
{
    var imgInstallRestore = document.getElementById("imgInstallRestore");
    var imgVisualC = document.getElementById("imgVisualC");    
    
    if (GetOSName() != "Windows")
    {
        imgInstallRestore.innerHTML = GetOSName() + " <br> Not Support OS ! ";       
        return;
    }
   
    if (GetOSVersion() == "XP")
    {
        imgInstallRestore.innerHTML = '<img src="../images/install_restore_xp.jpg" border=0 />';
    }
    else if(GetOSVersion() == "10")
    {
        imgInstallRestore.innerHTML = '<img src="../images/install_restore_win10.jpg"/>';
    }        
	else
	{
		imgInstallRestore.innerHTML = '<img src="../images/install_restore_win7.jpg"/>';
	}
}
DispGuideChangeUI();
</script>
