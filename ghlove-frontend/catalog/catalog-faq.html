				$s.api.getSido(vm.sidoParam,
					function(response) {
						vm.showLoading(false);
						vm.sidoList = response.resultList.sidoList;
					}
				);
				$s.api.getBsnsTypes(
                	function (response) {
                        vm.prjStatusList = [];
                        vm.prjStatusList.push({label: '전체', value: ''});

                        try {
                            let prjStatus = response.prjStatus;
                            let length = prjStatus.length;
                            for (let i = 0 ; i < length ; i++) {
                                let status = prjStatus[i];
                                if (status.extentionCode == 'FRONT') {
                                    let prjType = {label : status.label, value: status.id};
                                    vm.prjStatusList.push(prjType);
                                }
                            }
                        } catch (e) {
                            console.log = () => {};
                        }
                        vm.prjStatus = '';

                );

				vm.getCatalogSeasonalItem();
				vm.getLocgovFavItem();
				vm.getDsgnDonationItem();
			},
			getCatalogNewItem: function() {
				if (!vm.itemListPage) {
            		vm.itemListPage = 1;
        		}
				vm.catalogMngParam.page = this.itemListPage;
				vm.showLoading(true);
				vm.catalogMngParam.catalogYear = vm.catalogYear;
				vm.catalogMngParam.catalogNo = vm.catalogNo;
				vm.catalogMngParam.upperLocgovCode = vm.upperLocgovCode;
				vm.catalogMngParam.locgovCode = vm.locgovCode;
				vm.catalogMngParam.itemUserCodeList = vm.itemUserCodeList;
				$s.api.getSubmit(
					"/api/catalog/getCatalogNewItem",
					vm.catalogMngParam,
					function(response) {
						vm.showLoading(false);
						if(response.content != 0){
							if (vm.itemListPage < response.pageInfo.totalPages) {
								vm.showMoreBtn(true);
							} else {
								vm.showMoreBtn(false);
							}
							let size = response.content.length;

      // 네비 탭 누르면 정가운데로 위치
      var $scrItem = $('.tab_items');
        var scrIWidth = 0;
        for (var i=0; i<$scrItem.length; i++) {
            scrIWidth += $scrItem.eq(i).outerWidth();
        }
        $('.tab_group').css('width',scrIWidth)
        $scrItem.click(function(){
            var target = $(this);
            $scrItem.removeClass('on')
            target.addClass('on');
            muCenter(target);
        })

        function muCenter(target){
            var box = $('.tab_group_wrap');
            var boxItem = box.find('.tab_items');
            var boxHarf = box.width()/2;
            var pos;
            var listWidth=0;
            var targetLeft = 0;

            boxItem.each(function(){ listWidth += $(this).outerWidth(); })

            for (var i=0; i<target.index(); i++) targetLeft += boxItem.eq(i).outerWidth(); // 선택요소 까지 길이

            var selectTargetPos = (targetLeft + target.outerWidth()/2);
            if (selectTargetPos <= boxHarf) { // left
                pos = 0;
            }else if (listWidth - selectTargetPos <= boxHarf) { //right : target 절반 이후 영역이 boxHarf 보다 작을경우 right 정렬
                pos = listWidth-box.width();
            }else {
                pos = selectTargetPos - boxHarf; // 중앙정렬
            }

            setTimeout(function(){
                box.animate({scrollLeft:pos},300)
            }, 200);
        }
    </script>
