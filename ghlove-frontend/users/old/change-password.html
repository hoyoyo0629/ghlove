<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes"/>
	<meta name="description" content="">
	<meta name="author" content="">
	<link rel="icon" href="../../../../favicon.ico">
	<title>비밀번호 변경 | 고향사랑e음</title>
	<!-- Bootstrap core CSS -->
	<link rel="stylesheet" href="/static/css/bootstrap/bootstrap.css">
	<!-- Custom styles for this template -->
	<link rel="stylesheet" href="/static/css/swiper.min.css">
	<link rel="stylesheet" href="/static/css/common.css">
	<link rel="stylesheet" href="/static/css/layout.css">
	<link rel="stylesheet" href="/static/css/popup.css">
	<link rel="stylesheet" href="/static/css/users.css">
</head>
<body>
<div id="saleson" v-cloak>
	<layout-header></layout-header>

	<section class="contents change_pw_contents">
		<div class="tit_wrap">
			<h2 class="tit">90일 경과 비밀번호 변경하기</h2>
		</div>
		<div class="container">
			<div class="row no-gutters justify-content-center">
				<div class="col-12 col-md-6 col-lg-4">
					<div class="form_wrap_line">
						<form @submit.prevent="submit">
							<fieldset>
								<legend>90일 경과 비밀번호 변경하기</legend>
								<div class="form-group">
									<input type="password" v-model="param.originalPassword" class="form-control line"
									       placeholder="기존 비밀번호를 입력하세요"
									       title="기존 비밀번호를 입력하세요" required>
								</div>
								<div class="form-group">
									<input type="password" v-model="param.password"
									       @change="valid($event, validate.password)"
									       class="form-control line" placeholder="새 비밀번호를 입력하세요" title="새 비밀번호를 입력하세요"
									       required>
									<div class="invalid-feedback">비밀번호는 영문/숫자/특수문자를 혼합하여 8자 이상 20자 이하로 입력하세요.</div>
								</div>
								<div class="form-group">
									<input type="password" v-model="param.corfirmPassword"
									       @change="validfeed($event, corfirmPasswordFlag)"
									       class="form-control line" placeholder="비밀번호 재입력해주세요" title="비밀번호 재입력해주세요"
									       required>
									<div class="invalid-feedback">비밀번호가 일치하지 않습니다.</div>
								</div>
								<div class="info_dot">
									<p>비밀번호 변경 후 90일이 지난 후에는 비밀번호 재설정을 권장합니다.</p>
									<p>[연장하기]버튼을 누르시면 기존 비밀번호로 유지됩니다.</p>
								</div>
								<div class="row no-gutters btn-group">
									<div class="col">
										<button type="button" class="btn btn_lg btn_light" @click="delayChangePassword">
											연장하기
										</button>
									</div>
									<div class="col">
										<button type="submit" class="btn btn_lg btn_primary">변경</button>
									</div>
								</div>
							</fieldset>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>

	<layout-footer></layout-footer>
</div>


<!-- JavaScript -->
<script src="/static/js/jquery-3.4.1.min.js"></script>
<script src="/static/js/swiper.min.js"></script>
<script src="/modules/swiper/vue-awesome-swiper.js"></script>
<script src="/static/js/bootstrap/vendor/popper.min.js"></script>
<script src="/static/js/bootstrap/bootstrap.min.js"></script>
<script src="/static/js/jquery.popupoverlay.js"></script>
<script src="/static/js/jquery.waypoints.min.js"></script>
<script src="/static/js/jquery.counterup.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/header.js"></script>
<script src="/static/js/footer.js"></script>

<script src="/modules/babel.min.js"></script>
<script src="/modules/es6-promise.min.js"></script>
<script src="/modules/es6-promise.auto.min.js"></script>
<script src="/modules/axios.js"></script>
<script src="/modules/vue.js"></script>
<script src="/modules/httpVueLoader.js"></script>
<script src="/modules/op.config.js"></script>
<script src="/modules/op.saleson.js"></script>
<script type="text/babel" src="/modules/op.vue.js"></script>


<script type="text/babel">

	Vue.use(VueAwesomeSwiper);
    var vm = new Vue({
		el: '#saleson',
		components: {
			'layout-footer': httpVueLoader('/components/layouts/footer.vue'),
			'layout-header': httpVueLoader('/components/layouts/header.vue'),
		},
		data: {
			param: {
				password: '',
				corfirmPassword: '',
				originalPassword: '',
			},
			validate: {
				password: $s.validator.patterns.password
			},
			target : $s.pages.INDEX
		},
		methods: {
			submit: function () {

				if (!vm.checkfeed('.form_wrap_line')) {
					return;
				}

				$s.confirm('비밀번호를 변경 하시겠습니까?', function () {

					$s.api.changePassword(vm.param, function (response) {
						$s.alert('비밀번호 변경 완료 했습니다.', function () {
							$s.redirect($s.pages.LOGIN);
						});
					}, function (error) {
						$s.alert(error.response.data.message);
					});

				});
			},
			delayChangePassword: function () {

				$s.confirm('비밀번호를 만료일을 연장 하시겠습니까?', function () {

					$s.api.delayChangePassword( function (response) {
						$s.alert('비밀번호를 만료일을 연장 했습니다.', function () {
							$s.redirect($s.pages.LOGIN);
						});
					}, function (error) {
						$s.alert('비밀번호 만료일 연장에 실패 했습니다');
					});

				});

			}
		},
		computed: {
			corfirmPasswordFlag: function () {
				return this.param.password == this.param.corfirmPassword;
			}
		},
		mounted: function() {
			this.$nextTick(function () {
				Saleson.init();
			});
		}
	});
</script>


</body>
</html>
