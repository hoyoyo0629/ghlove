<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/favicon.ico" />
    <title>로그인 | 고향사랑e음</title>
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="/static/css/bootstrap/bootstrap.css" />
    <!-- Custom styles for this template -->
    <link rel="stylesheet" href="/static/css/swiper.min.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/popup.css" />
    <link rel="stylesheet" href="/static/css/main.css" />

    <link rel="stylesheet" href="/static/css/event.css" />

    <!-- ali custom Style -->
    <link rel="stylesheet" href="/static/css/default_ali.css" />
    <link rel="stylesheet" href="/static/css/header-footer_ali.css" />

    <!-- ali Section Style :: 이건 꼭 쓰세요:) -->
    <link rel="stylesheet" href="/static/css/login-total.css" />
    <link rel="stylesheet" href="/static/css/joind-agf.css" />
    <link rel="stylesheet" href="/static/css/change-pw.css" />
    <!--새 비밀번호 확인-->
    <link rel="stylesheet" href="/static/css/authentication-modal.css" />
  </head>

  <body>
    <div id="saleson" v-cloak>
      <div id="wrap">
        <!-- 가입완료 축하 모달  -->
        <div class="black-bg" id="joinComplete">
          <div class="overlayer join-complete">
            <div class="overlayer-header"></div>
            <div class="overlayer-body">
              <h2>고향사랑e음<br />카카오톡 인증 로그인 통한 회원가입 완료</h2>
              <h2 style="color: red">
                {{joinName}}회원님의 ID는 {{loginId}}입니다.
              </h2>
              <h2 style="color: red" v-html="errMsg" v-if="errMsg"></h2>
              <img
                src="/static/images/icon/cli-icon_join-complete.png"
                alt="가입을 축하합니다"
              />
              <div class="line"></div>
              <h2 class="s-txt" id="smsAgree">국민비서·SMS 수신동의</h2>
              <!-- <p class="s-txt" id="smsAgree">국민비서·SMS 수신동의</p> -->
              <!-- <p class="s-txt" id="smsDisAgree">국민비서·SMS 동의안함</p> -->
              <h2 class="s-txt" id="emailAgree">email 수신동의</h2>
              <!-- <p class="s-txt" id="emailAgree">email 수신동의</p> -->
              <!-- <p class="s-txt" id="emailDisAgree">email 동의안함</p> -->
              <p>미동의를 선택하실 경우 마이페이지 > 동의 항목을</p>
              <p>미선택으로 체크하시기 바랍니다.</p>
              <!-- 버튼그룹 -->
              <div class="btn-box">
                <button
                  type="button"
                  class="blueBtn u-confirm"
                  @click="closePopupLayer()"
                >
                  확인
                  <span>
                    <img
                      src="/static/images/icon/cli-icon_btn-hover-arrow.png"
                      alt=""
                    />
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- //가입완료 축하 모달 -->

        <!-- 비밀번호 변경 팝업 -->
        <template id="pwdAreaModal">
          <form
            action="/"
            id="agreeForm"
            name="passwordChangeForm"
            @submit.prevent
          >
            <!-- 3개월 경과 : 본인인증  -->
            <div class="black-bg" id="pwdChangeNotiModal">
              <div class="overlayer">
                <div class="overlayer-header">비밀번호 변경</div>
                <div class="overlayer-body">
                  <h2>
                    동일 비번 사용기간이<br /><span class="pointRed">3개월</span
                    >이 경과 되었습니다.
                  </h2>
                  <p>
                    3개월 경과 시 동일한 비밀번호를 사용하실 수 없습니다.<br />
                    본인 인증을 진행해주시기 바랍니다.
                  </p>
                  <!-- 버튼그룹 -->
                  <div class="btn-box">
                    <button
                      type="button"
                      class="blueBtn u-confirm"
                      @click="openMobileAuth()"
                    >
                      본인인증
                      <span>
                        <img
                          src="/static/images/icon/cli-icon_btn-hover-arrow.png"
                          alt=""
                        />
                      </span>
                    </button>
                  </div>
                  <p>
                    본인인증 후에 비밀번호 변경페이지로 이동합니다.<br />&nbsp;
                  </p>
                  <div class="line"></div>
                  <p class="s-txt">
                    고향사랑e음에서는 3개월 단위로<br />비밀번호 변경 서비스를
                    진행하고 있습니다.
                  </p>
                </div>
              </div>
            </div>
            <!-- //3개월 경과 : 본인인증 -->
            <!-- 3개월 경과 : 인증완료 후 비밀번호 변경  -->
            <div class="black-bg" id="pwdChangeModal">
              <div class="overlayer">
                <div class="overlayer-header">비밀번호 변경</div>
                <div class="overlayer-body">
                  <!--<h2> 동일 비번 사용기간이<br><span class="pointRed">3개월</span>이 경과 되었습니다.</h2>-->
                  <h2>
                    안전한 개인정보 보호를 위해<br />지금 비밀번호를 변경해
                    주세요.
                  </h2>
                  <!--<p>
                            본인 인증이 완료 되었습니다. 비밀번호를 초기화 합니다.<br>
                            새로운 비밀번호를 입력해 주세요.
                        </p>-->
                  <p>
                    회원님께서는 장기간 비밀번호를 변경하지 않고 동일한
                    비밀번호를 사용 중<br />
                    이십니다. 정기적인 비밀번호 변경으로 회원님의 개인정보를
                    보호해 주세요.
                  </p>
                  <div class="line"></div>
                  <div class="info-field-group">
                    <div class="info-field-items newpw">
                      <label for="userPW" class="flied-title"
                        >기존 비밀번호 입력</label
                      >
                      <input
                        type="password"
                        name="userPW"
                        id="userPW"
                        value=""
                        minlength="8"
                        maxlength="20"
                        v-model="pwdParam.userPassword"
                        autocomplete="password"
                      />
                    </div>
                    <div class="info-field-items newpw">
                      <label for="userNewPW" class="flied-title"
                        >새 비밀번호 입력</label
                      >
                      <input
                        type="password"
                        name="userNewPW"
                        id="userNewPW"
                        value=""
                        minlength="8"
                        maxlength="20"
                        v-model="pwdParam.password"
                        autocomplete="new-password"
                      />
                    </div>
                    <div class="info-field-items newpw">
                      <label for="userNewPwC" class="flied-title"
                        >새 비밀번호 확인</label
                      >
                      <input
                        type="password"
                        name="userNewPwConfirm"
                        id="userNewPwConfirm"
                        value=""
                        v-model="pwdParam.corfirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="20"
                        @keyup="checkPwd($event);"
                      />
                    </div>
                    <div class="info-field-items">
                      <div class="pw-validation-area">
                        <ul>
                          <li>
                            <span class="pw-validation"
                              ><img
                                src="/static/images/icon/pw-unavailable.png"
                                alt="사용불가-아래 항목을 모두 만족해야 합니다"
                            /></span>
                            <span class="txt_box">
                              <span class="txt_items">
                                비밀번호 보안도 :
                                <strong
                                  :class="[redPoint.weekPwd? 'pointRed' : '']"
                                  >약함</strong
                                >
                                /
                                <strong
                                  :class="[redPoint.strongPwd? 'pointRed' : '']"
                                  >강함</strong
                                >
                              </span>
                              <span class="txt_items"
                                >( 4가지 체크 완료 시 V 표시 )</span
                              >
                            </span>
                          </li>
                          <li>
                            <span class="pw-validation"
                              ><img
                                src="/static/images/icon/pw-unavailable.png"
                                alt="사용불가-숫자, 기호, 영문자 미포함" /></span
                            >1. 숫자, 기호, 영문자 포함
                          </li>
                          <li>
                            <span class="pw-validation"
                              ><img
                                src="/static/images/icon/pw-unavailable.png"
                                alt="사용불가-3개 이상 연속 문자/숫자 제외" /></span
                            >2. 3개 이상 연속 문자/숫자 제외
                          </li>
                          <li>
                            <span class="pw-validation"
                              ><img
                                src="/static/images/icon/pw-unavailable.png"
                                alt="사용불가-아이디를 포함할 수 없음" /></span
                            >3. 아이디를 포함할 수 없음
                          </li>
                          <li>
                            <span class="pw-validation"
                              ><img
                                src="/static/images/icon/pw-unavailable.png"
                                alt="사용불가-최소 9자, 최대 20자" /></span
                            >4. 최소 9~20자
                          </li>
                        </ul>
                      </div>
                    </div>
                  </div>
                  <!-- 버튼그룹 -->
                  <div class="btn-box">
                    <button
                      type="button"
                      class="blueBtn cancellation"
                      @click="changPwdLater()"
                    >
                      다음에변경(6개월)
                      <span>
                        <img
                          src="/static/images/icon/cli-icon_btn-hover-arrow.png"
                          alt=""
                        />
                      </span>
                    </button>
                    <button
                      type="button"
                      class="blueBtn u-confirm"
                      @click="changPwd()"
                    >
                      본인인증 후 변경
                      <span>
                        <img
                          src="/static/images/icon/cli-icon_btn-hover-arrow.png"
                          alt=""
                        />
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <!-- //3개월 경과 : 인증완료 후 비밀번호 변경 -->
          </form>
        </template>
      
         <template id="temp-popup">             
          <div class="temp-popup" id="temp-birthday">
            <div class="overlayer">       
              <img src="../static/images/gibu-blank.jpg" alt="">
              <p>{{birthday}}</p>
              <div class="btn-box">
                <button
                  type="button"
                  class="temp-button" @Click="goToIndex()"></button>
              </div>
            </div>          
          </div>
        </template>
      

        <!-- 본인인증 -->
        <layout-auth @signdata="doSignData()"></layout-auth>

        <!-- header component -->
        <layout-header-ali></layout-header-ali>

        <div id="contents">
          <!-- 아이디 로그인 -->
          <section class="login-total center" v-if="tabId=='1'">
            <!-- 아이디 로그인 -->
            <div class="login-box general">
              <div class="loginType">
                <ul>
                  <li class="currentB">
                    <button
                      type="button"
                      @click="setTab(1)"
                      title="아이디 로그인을 선택합니다"
                    >
                      아이디 로그인
                    </button>
                  </li>
                  <li>
                    <button
                      type="button"
                      @click="setTab(2)"
                      title="금융/간편 인증 로그인을 선택합니다"
                    >
                      금융/간편 인증
                    </button>
                  </li>
                  <li>
                    <button
                      type="button"
                      @click="setTab(3)"
                      title="디지털원패스 로그인을 선택합니다"
                    >
                      디지털원패스
                    </button>
                  </li>
                </ul>
              </div>
              <div class="login-title-box">
                <img src="/static/images/icon/cli-icon-bullet.png" alt="" />
                <h2 class="login-title">아이디 <strong>로그인</strong></h2>
              </div>

              <form
                action="/"
                name=""
                id="login-genaral"
                @submit.prevent="submit"
                @keydown="enterInput($event)"
              >
                <div class="login-field-group">
                  <span class="login-field-items">
                  	<input
                      type="text"
                      placeholder="5부제"
                      id="loginStep"
                      v-model="loginStep"
                      style="width:10%;"
                    />
                    <input
                      type="text"
                      placeholder="아이디"
                      id="id"
                      v-model="loginRequest.loginId"
                      title="아이디를 입력하세요."
                    />
                  </span>
                  <span class="login-field-items">
                    <input
                      type="password"
                      placeholder="비밀번호"
                      id="pw"
                      v-model="loginRequest.password"
                      title="비밀번호를 입력하세요."
                    />
                  </span>
                  <span class="login-field-check saveId">
                    <input type="checkbox" id="id_save" v-model="saveId" />
                    <label for="id_save"
                      ><span class="marker"></span>아이디저장</label
                    >
                  </span>
                </div>
                <div class="login-field-group">
                  <button
                    id="loginBtn"
                    class="login"
                    type="button"
                    @click="submitBefore"
                  >
                    로그인
                  </button>
                </div>
                <div class="login-field-group">
                  <div class="login-check-wrap">
                    <span class="find-wrap">
                      <a href="javascript:$s.redirect($s.pages.FIND_ID_PW);"
                        >아이디·비밀번호찾기</a
                      >
                    </span>
                    <span class="find-wrap">
                      <a href="/users/join.html" class="moreView deepGray"
                        ><strong>회원가입</strong></a
                      >
                    </span>
                  </div>
                </div>
              </form>

              <button
                style="
                  width: 90%;
                  max-width: 400px;
                  text-align: center;
                  margin: auto;
                  background-color: #fee500;
                  border-radius: 8px;
                "
                @click.prevent="submitKakao"
                title="카카오톡 인증 로그인"
              >
                <div
                  style="
                    display: flex;
                    justify-content: space-around;
                    align-items: center;
                    width: 100%;
                  "
                >
                  <img
                    src="/static/images/kakao/kakaotalk_symbol_screen.png"
                    style="width: 30px; margin: 15px"
                    title="카카오톡 인증 로그인 로고"
                  />
                  <span style="width: 100%; margin-right: 30px"
                    >카카오톡 인증 로그인</span
                  >
                </div>
              </button>
            </div>
          </section>

          <!-- 금융/간편 인증 로그인 -->
          <section class="login-total center" v-if="tabId=='2'">
            <h2 class="hidden">고향사랑e음</h2>
            <!-- 금융/간편 인증 로그인 -->
            <div class="login-box digital">
              <div class="loginType">
                <ul>
                  <li>
                    <button
                      type="button"
                      @click="setTab(1)"
                      title="아이디 로그인을 선택합니다."
                    >
                      아이디로그인
                    </button>
                  </li>
                  <li class="currentB">
                    <button
                      type="button"
                      @click="setTab(2)"
                      title="금웅/간편인증 로그인을 선택합니다."
                    >
                      금융/간편 인증
                    </button>
                  </li>
                  <li>
                    <button
                      type="button"
                      @click="setTab(3)"
                      title="디지털원패스 로그인을 선택합니다"
                    >
                      디지털원패스
                    </button>
                  </li>
                </ul>
              </div>
              <div class="auth_wrap">
                <form action="/" id="" name="" @submit.prevent>
                  <div class="simple-login">
                    <div class="financ-login-wrap">
                      <div class="finance-img">
                        <img
                          src="/static/images/icon/financ.png"
                          alt="금융인증서"
                        />
                      </div>
                      <p class="s-txt">
                        <span>금융기관에 등록된</span>
                        <span>금융인증서로 본인 인증 하기</span>
                      </p>
                    </div>
                  </div>
                  <div class="login-field-group">
                    <button
                      id="finAuthBtn"
                      class="login logins"
                      type="button"
                      @click="financLogin();"
                      title="새 창 열림"
                    >
                      <span>금융인증서 로그인</span>
                    </button>
                  </div>
                </form>
                <form action="/" id="login-genaral" name="" @submit.prevent>
                  <div
                    class="simple-login"
                    id="authBtn"
                    onclick="openSimpeAuthBefore();"
                  >
                    <div class="simple-login-wrap">
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/kakao.png"
                          alt="카카오톡"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/kb.png"
                          alt="국민인증서"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/payco.png"
                          alt="페이코"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/pass.png"
                          alt="통신사PASS"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/samsung.png"
                          alt="SAMSUNG PASS"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/naver.png"
                          alt="네이버"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/shinhan.png"
                          alt="신한인증서"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/toss.png"
                          alt="토스"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/nh.png"
                          alt="NH인증서"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/hana.png"
                          alt="하나인증서"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/dream.png"
                          alt="드림인증"
                        />
                      </span>
                      <span class="sim_auth">
                        <img
                          src="/static/images/icon/sim_auth/banks.png"
                          alt="뱅크샐러드"
                        />
                      </span>
                    </div>
                  </div>

                  <div class="login-field-group">
                    <button
                      class="login"
                      type="button"
                      onclick="openSimpeAuthBefore();"
                      title="새 창 열림"
                    >
                      <span>간편인증 로그인</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </section>

          <section class="login-total center" v-if="tabId=='3'">
            <h2 class="hidden">고향사랑e음</h2>
            <!-- 디지털 원패스 로그인 -->
            <div class="login-box digital">
              <div class="loginType">
                <ul>
                  <li>
                    <button
                      type="button"
                      @click="setTab(1)"
                      title="아이디 로그인을 선택합니다"
                    >
                      아이디로그인
                    </button>
                  </li>
                  <li>
                    <button
                      type="button"
                      @click="setTab(2)"
                      title="금융/간편 인증 로그인을 선택합니다"
                    >
                      금융/간편 인증
                    </button>
                  </li>
                  <li class="currentB">
                    <button
                      type="button"
                      @click="setTab(3)"
                      title="디지털원패스 로그인을 선택합니다"
                    >
                      디지털원패스
                    </button>
                  </li>
                </ul>
              </div>
              <div class="login-title-box">
                <img src="/static/images/icon/cli-icon-bullet.png" alt="" />
                <h2 class="login-title">
                  디지털원패스 <strong>로그인</strong>
                </h2>
                <p>
                  하나의 아이디로 안전하고 편리하게<br />
                  여러 전자정부 서비스를 이용할 수 있는 서비스입니다.
                </p>
              </div>

              <form
                action="/"

      var popup = null;
      var url = "https://easysign.anyid.go.kr:443/esign"; // 중계 인증창 호출 url 운영
      var status =
        "toolbar=no,scrollbars=no,location=no,resizable=no,status=no,menubar=no,width=838,height=611"; // option
      var devUrl = "https://testeasysign.anyid.go.kr/esign";
      function openSimpeAuthBefore() {
        if ($s.config.isUseNetFunnel) {
          NetFunnel_Action({ action_id: "login" }, function (ev, ret) {
            openSimpeAuth();
          });
        } else {
          openSimpeAuth();
        }
      }
      function openSimpeAuth() {
        if (popup == null || popup.closed == true) {
          popup = window.open(url, "simpleAuth", status); //팝업 호출
          getAccessInfo("simpleAuth");
        }
      }

      initVal = false;
      initCount = 0;
      function receiveMsg(event) {
        var jsonData = JSON.parse(event.data);
        if (jsonData.initFlag == "true") {
          // console.log("@@@@@ jsonData.initFlag  =  "+jsonData.initFlag);
          initVal = true;
        }

        if (jsonData.status == "success") {
          $s.api.postSubmit("/api/user/simpleMberCi", jsonData,
            function (mberResponse) {
              if (mberResponse.data != null) {
                var passParam = {};
                passParam.loginId = mberResponse.data.loginId;
                passParam.passwordType = "P";
                passParam.loginStep = vm.loginStep;

                $s.api.postSubmit("/api/user/passwordtypetest", passParam,
                  function (passResponse) {
                    if(!passResponse.result && !passResponse.resultCnt){
                      vm.birthday = passResponse.birthday;
                      $('#temp-birthday').addClass('show');
                      return false;
                    }
                    $s.api.getSimpleAuthResult(jsonData);
                  }
                );
              } else if (
                mberResponse.data == null &&
                jsonData.fn == "authComplete"
              ) {
                $s.alert(
                  "인증서 정보에 대한 회원정보를 찾을 수 없습니다.",
                  function () {
                    location.href = "/users/join.html";
                  }
                );
              }
            }
          );
        }
      }

      function getAccessInfo(data) {
        var passParam = {};
        passParam.loginId = vm.loginRequest.loginId;
        passParam.passwordType = "P";
        passParam.loginStep = vm.loginStep;

        $s.api.postSubmit("/api/user/passwordtypetest", passParam,
          function (passResponse) {
            if(!passResponse.result && !passResponse.resultCnt){
              vm.birthday = passResponse.birthday;
              $('#temp-birthday').addClass('show');
              return false;
            }
            $s.api.postSubmitNoAuth(
              "/api/auth/getAccessInfo",
              data,
              function (response) {
                sendData(response);
              }
            );
          }
        );
      }
      function sendData(data) {
        setTimeout(function () {
          if (initVal) {
            if (data.fn == "simpleAuth") {
              popup.postMessage(
                '{"simpleType":"simpleAuth", "accKey":"' +
                  data.accKey +
                  '", "accToken":"' +
                  data.accToken +
                  '"}',
                "*"
              );
            } else if (data.fn == "simpleSign") {
              popup.postMessage(
                '{"simpleType":"simpleSign", "accKey":"' +
                  data.accKey +
                  '", "accToken":"' +
                  data.accToken +
                  '","signTarget":"' +
                  data.signTarget +
                  '"}',
                "*"
              );
            } else if (data.fn == "simpleAuthNonMember") {
              popup.postMessage(
                '{"simpleType":"simpleAuth", "accKey":"' +
                  data.accKey +
                  '", "accToken":"' +
                  data.accToken +
                  '"}',
                "*"
              );
            } else if (data.fn == "simpleSignNonMember") {
              popup.postMessage(
                '{"simpleType":"simpleSignNonMember", "accKey":"' +
                  data.accKey +
                  '", "accToken":"' +
                  data.accToken +
                  '","signTarget":"' +
                  data.signTarget +
                  '"}',
                "*"
              );
            }
            initVal = false;
            initCount = 0;
          } else {
            if (initCount > 20) {
              initCount = 0;
              return;
            }
            sendData(data);
            initCount++;
          }
        }, 300);
      }
      window.addEventListener("message", receiveMsg, false);
    </script>

          getCookieValue: function (key) {
            let cookieKey = key + "=";
            let result = "";
            const cookieArr = document.cookie.split(";");

            for (let i = 0; i < cookieArr.length; i++) {
              if (cookieArr[i][0] === " ") {
                cookieArr[i] = cookieArr[i].substring(1);
              }

              if (cookieArr[i].indexOf(cookieKey) === 0) {
                result = cookieArr[i].slice(
                  cookieKey.length,
                  cookieArr[i].length
                );
                return result;
              }
            }
            return result;

          checkPwd: function (event) {
            // var val = event.target.value;
            var val = vm.pwdParam.corfirmPassword;
            var password = vm.pwdParam.password;

            var isPwdOk = false;

            vm.redPoint.weekPwd = false;
            vm.redPoint.strongPwd = false;

            var isPwdVail1 = false; // 숫자, 기호, 영문자 포함
            var isPwdVail2 = false; // 3개이상 연속 문자/숫자 제외
            var isPwdVail3 = false; // 아이디 포함
            var isPwdVail4 = false; // 길이

            var number = val.search(/[0-9]/g);
            var english = val.search(/[a-zA-Z]/g);
            var sword = val.search(
              /[\{\}\[\]\/?.,;:|\)*~`!^\-_+<>@\#$%&\\\=\(\'\"]/g
            );

            // 숫자나 기호, 영문자 포함
            if (number < 0 || english < 0 || sword < 0) {
              $("span.pw-validation")
                .eq(1)
                .removeClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-unavailable.png")
                .attr("alt", "사용불가-숫자, 기호, 영문자 미포함");
            } else {
              $("span.pw-validation")
                .eq(1)
                .addClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-available.png")
                .attr("alt", "사용가능-숫자, 기호, 영문자 포함");
              isPwdVail1 = true;
            }

            if (
              /(\w)\1\1/.test(val) ||
              password == "" ||
              val == "" ||
              !this.isContinued(val)
            ) {
              $("span.pw-validation")
                .eq(2)
                .removeClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-unavailable.png")
                .attr("alt", "사용불가-3개 이상 연속 문자/숫자 제외");
            } else {
              $("span.pw-validation")
                .eq(2)
                .addClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-available.png")
                .attr("alt", "사용가능-3개 이상 연속 문자/숫자 없음");
              isPwdVail2 = true;
            }

            var loginId = vm.pwdParam.loginId;
            if (val.indexOf(loginId) > -1) {
              $("span.pw-validation")
                .eq(3)
                .removeClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-unavailable.png")
                .attr("alt", "사용불가-아이디를 포함할 수 없음");
            } else {
              $("span.pw-validation")
                .eq(3)
                .addClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-available.png")
                .attr("alt", "사용가능-아이디를 포함하지 않음");
              isPwdVail3 = true;
            }

            if (!(val.length >= 9 && val.length <= 20)) {
              $("span.pw-validation")
                .eq(4)
                .removeClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-unavailable.png")
                .attr("alt", "사용불가-최소 9자, 최대 20자");
            } else {
              isPwdVail4 = true;
              $("span.pw-validation")
                .eq(4)
                .addClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-available.png")
                .attr("alt", "사용가능-최소 9자, 최대 20자");
            }

            if (!isPwdVail1 || !isPwdVail2 || !isPwdVail3 || !isPwdVail4) {
              $("span.pw-validation")
                .eq(0)
                .removeClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-unavailable.png")
                .attr("alt", "사용불가-아래 항목 확인 필요");
              vm.redPoint.weekPwd = true;
              vm.redPoint.strongPwd = false;
            } else {
              $("span.pw-validation")
                .eq(0)
                .addClass("vali-confirm")
                .children("img")
                .attr("src", "/static/images/icon/pw-available.png")
                .attr("alt", "사용가능-아래 항목 모두 만족");
              vm.redPoint.weekPwd = false;
              vm.redPoint.strongPwd = true;
              isPwdOk = true;
            }
            return isPwdOk;
          },
          isContinued: function (obj) {
            // 연속된 문자 확인
            var ascSeqCharCnt = 0; // 오름차순 연속 문자 카운트
            var descSeqCharCnt = 0; // 내림차순 연속 문자 카운트

            var char_0;
            var char_1;
            var char_2;

            var diff_0_1;
            var diff_1_2;

            for (var i = 0; i < obj.length; i++) {
              // charAt(): 문자값 반환
              char_0 = obj.charAt(i);
              char_1 = obj.charAt(i + 1);
              char_2 = obj.charAt(i + 2);

              // charCodeAt(): 유니코드값 반환
              diff_0_1 = char_0.charCodeAt(0) - char_1.charCodeAt(0);
              diff_1_2 = char_1.charCodeAt(0) - char_2.charCodeAt(0);

              if (diff_0_1 === 1 && diff_1_2 === 1) {
                ascSeqCharCnt += 1;
              }

              if (diff_0_1 === -1 && diff_1_2 === -1) {
                descSeqCharCnt += 1;
              }
            }
            if (ascSeqCharCnt >= 1 || descSeqCharCnt >= 1) {
              return false;
            }
            return true;
          },

            var onepassId = vm.onepassLoginRequest.loginId;

				vm.onepassLoginRequest.loginId = vm.onepassLoginRequest.loginId.trim();

          submitKakao: function () {
            var passParam = {};
            passParam.loginId = mberResponse.data.loginId;
            passParam.passwordType = "P";
            passParam.loginStep = vm.loginStep;
            
            $s.api.postSubmit("/api/user/passwordtypetest", passParam,
              function (passResponse) {
                if(!passResponse.result && !passResponse.resultCnt){
                  vm.birthday = passResponse.birthday;
                  $('#temp-birthday').addClass('show');
                  return false;
                }
                if (this.isKakaoInit()) {
                  let target = vm.getQueryStr("target");

                  }

                  sessionStorage.setItem("kakao-login-target", target);
                  /*
                              Kakao.Auth.authorize({
                                  redirectUri: KAKAO_REDIRECT_URL,
                                  //scope: 'account_email,gender',
                                  prompt: 'cert',                       // 카카오 인증 K2100 사용시
                                  //prompt: 'none',
                              });
                              */
                  let signData = this.getRandomKey(10);

                  setTimeout(function () {
                    Kakao.Auth.authorizeForCert({
                      redirectUri: KAKAO_REDIRECT_URL,
                      settleId: KAKAO_SETTLE_ID,
                      signData: signData,
                    });
                  }, 500);
                } else {
                  $s.alert("새로고침 후 다시 시도해주세요.", "kakaoLoginBtn");
                }
              }
            );

            return false;
          },
          getQueryStr: function (paramKey) {
            return new URLSearchParams(location.search).get(paramKey);
            //return location.search;
          },
          loadingMounted: function () {
            if (this.isKakaoInit()) {
              if (this.getQueryStr("code")) {
                let signData = sessionStorage.getItem("kakao-sign-key");
                let param = {
                  code: vm.getQueryStr("code"),
                  //, "scope" : "account_email"
                  requestToken: signData,
                };
                vm.showLoading(true);
                $s.api.postSubmitNoAuth("/api/kakao-link/kakao-link-login", param,
                  function (response) {
                    vm.showLoading(false);
					history.replaceState({}, null, location.pathname);
                    sessionStorage.removeItem("kakao-sign-key");
                    if (response && response.errMsg) {
                      $s.alert(response.errMsg, "kakaoLoginBtn");
                    } else if (response && response.data) {
                      let target = sessionStorage.getItem("kakao-login-target");
					  
                      if (!target) {
                        target = "/";
                      }
                      if ($s.config.isUseNetFunnel) {
                        NetFunnel_Complete();
                      }
                      let savedLoginId = response.data.loginId;
                      sessionStorage.removeItem("kakao-login-target");

                      if (
                        response.data &&
                        response.data.grant_type == "ALTERNATE_SYSTEM_DENIED"
                      ) {
                        if (response.data.code == "JOIN_MEMBER") {
                          vm.loginId = savedLoginId;
                          vm.errMsg = response.data.alternateSystemMsg;
                          if (vm.errMsg) {
                            vm.errMsg = vm.errMsg.replaceAll("\n", "<br>");
                          }
                          $("#joinComplete").show();
                        } else {
                          $s.alert(response.data.alternateSystemMsg);
                        }
                        return;
                      }

                      $s.setToken(response.data.token, response.status, "USER");
                      vm.loginId = savedLoginId;
                      vm.joinName = response.data.name;
                      $s.core.setData($s.const.SAVED_LOGIN_ID, savedLoginId);
                      $(".black-bg").removeClass("show");

                      if (response.data.code == "JOIN_MEMBER") {
                        vm.prePageInfo = target;
                        $("#joinComplete").show();
                      } else {
                        $s.redirect(target);
                      }
                    } else {
                      $s.alert("문제가 발생했습니다. ");
                      
                    }
                  },
                  function (error) {
                    vm.showLoading(false);
                    sessionStorage.removeItem("kakao-sign-key");
                    $s.alert("오류가 발생했습니다." );
                    
                  }
                );
              } else if (this.getQueryStr("error")) {
                if (this.getQueryStr("error") == "consent_required") {
                  Kakao.Auth.authorize({
                    redirectUri: KAKAO_REDIRECT_URL,
                  });
                } else if (this.getQueryStr("error_description")) {
                  $s.alert(this.getQueryStr("error_description"));
                } else {
                  $s.alert(this.getQueryStr("error"));
                }
                /*} else {
                              $s.alert(location.search);*/
              }
            }
          },
          goToIndex: function(){
            $s.redirect("/index.html");
          },
          showLoading: function (isLoading) {
            this.$refs.layoutFooter.showLoading(isLoading);
          },
          isKakaoInit: function () {
            if (Kakao.isInitialized()) {
              return true;
            } else {
              $s.alert(
                "카카오 기능 불러오기에 실패했습니다.\n새로고침 후 다시 진행해주세요.\n지속 문제 발생시 고객센터로 문의바랍니다."
              );
              return false;
            }
          },
          getRandomKey: function (length) {
            const characters =
              "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = "";
            const charactersLength = characters.length;
            for (let i = 0; i < length; i++) {
              result += characters.charAt(
                Math.floor(Math.random() * charactersLength)
              );
            }
            sessionStorage.setItem("kakao-sign-key", result);
            return result;
          },
          closePopupLayer: function () {
            //$s.redirect(this.prePageInfo);
            $s.redirect("/donation/donation.html");
          },
        },
        computed: {
          isKakaoBrowser: function () {
            // return navigator.userAgent.match(/KAKAOTALK/i) == null ? false : true;
            return true;
          },
        },

              $s.redirect(target);

            if (savedLoginId != null && savedLoginId != "") {
              vm.saveId = true;
              vm.loginRequest.loginId = savedLoginId;

              vm.target = decodeURIComponent(target);

            var savedOnePassLoginId = $s.core.getData(

              vm.saveOnePassId = true;
              vm.onepassLoginRequest.loginId = savedOnePassLoginId;
            }
          });
        },
      });
      window.app = vm;
    </script>

      // 휴대폰 인증 후 실행 method
      function mobileAuthResponse(response) {
        // 본인인증 시
        if (response.data.userName != undefined) {
          $("#authModal").removeClass("show");

          vm.authType = "mobile";

          vm.checkAuth(response.data);
        }
      }

      // MagicLine 결과값 수신 CallBack
      // code    : 전자서명 결과값
      // message : 전자서명 메시지
      function mlCallBack(code, message) {
        if (code == 0) {
          var formData = {
            signOrigin: "LOGIN",
            sign: encodeURIComponent(message.encMsg),
            csCheckType: "1",
            signData: "LOGIN",
          };

          $s.api.postSubmit(
            "/api/magicline/signedFormRGhlove",
            formData,
            function (response) {
              if (response.status === "OK") {
                if (response.result === "SUCCESS") {
                  // 		DN		: "cn=850테스트유효001,ou=people,ou=상호연동테스트,o=Government of Korea,c=KR"
                  // 		message : ""
                  // 		result	: "SUCCESS"
                  // console.log("DN", response.DN);
                  // console.log("message", response.message);
                  // console.log("result", response.result);
                  vm.pwdParam.mberDn = response.DN;
                  if (response.DN == "") {
                    $s.alert("서명 검증에 실패 하였습니다.");
                  } else {
                    vm.authType = "sign";
                    vm.checkSign();
                  }
                } else {
                  // 		DN		: ""
                  // 		message : "서명 검증에 실패 하였습니다."
                  // 		result	: "FALI"
                  $s.alert(response.message);
                }
              }
            },
            function (error) {
              $s.alert(error.response.data.description);
            }
          );
        } else {
          alert("결과값 수신에 실패하였습니다.");
          return;
        }
      }
    </script>
