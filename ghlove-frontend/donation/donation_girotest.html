    <script type="text/babel">
        Vue.use(VueAwesomeSwiper);

            },

                giroParams : {}

            methods: {
				changeGiroNo: function (giroNo) {
                    let params = {};
					if(giroNo === '1005376')
                    {
                        params.sortCode = '26';
                        params.giroNo = giroNo;
                        params.elecNo = '2638011023609310632';
                        params.birthDate = '760603';
                        params.payerName = '원재공';
                        $('#sortCode').val('26');
                        $('#giroNo').val(giroNo);
                        $('#elecNo').val('2638011023609310632');
                        $('#payerName').val('원재공');
                        $('#birthDate').val('760603');
                        $('#callDt').val('20241231022415');
                    }
                    else if(giroNo === '1000805')
                    {
                        params.sortCode = '27';
                        params.giroNo = giroNo;
                        params.elecNo = '2729011023313602792';
                        params.birthDate = '19760603';
                        params.payerName = '원재공';
                        $('#sortCode').val('26');
                        $('#giroNo').val(giroNo);
                        $('#elecNo').val('2729011023313602792');
                        $('#payerName').val('원재공');
                        $('#birthDate').val('760603');
                        $('#callDt').val('20241231022415');
                    }
                    else if(giroNo === '1005185')
                    {
                        params.sortCode = '28';
                        params.giroNo = giroNo;
                        params.elecNo = '2811011023805630759';
                        params.birthDate = '760603';
                        params.payerName = '원재공';
                        $('#sortCode').val('26');
                        $('#giroNo').val(giroNo);
                        $('#elecNo').val('2811011023805630759');
                        $('#payerName').val('원재공');
                        $('#birthDate').val('760603');
                        $('#callDt').val('20241231022415');
                    }
                    else if(giroNo === '1004953')
                    {
                        params.sortCode = '41';
                        params.giroNo = giroNo;
                        params.elecNo = '4119011023420547099';
                        params.birthDate = '760603';
                        params.payerName = '원재공';
                        $('#sortCode').val('26');
                        $('#giroNo').val(giroNo);
                        $('#elecNo').val('4119011023420547099');
                        $('#payerName').val('원재공');
                        $('#birthDate').val('760603');
                        $('#callDt').val('20241231022415');
                    }
					else

                        params.sortCode = '11';

                        params.elecNo = '1126023022010412065';
                        params.birthDate = '970112';
                        params.payerName = '테스트15';

                //금결원 인터넷지로 열기
                openGiroTest : function() {
					let giroParams = {};
					//giroParams.sortCode = vm.giroParams.sortCode;
                    //giroParams.giroNo =     vm.giroParams.giroNo;
                    //giroParams.elecNo = vm.giroParams.elecNo;
                    //giroParams.birthDate = vm.giroParams.birthDate;
                    //giroParams.payerName = vm.giroParams.payerName;
                    giroParams.sortCode = $('#sortCode').val();
                    giroParams.giroNo = $('#giroNo').val();
                    giroParams.elecNo = $('#elecNo').val();
                    giroParams.birthDate = $('#birthDate').val();
                    giroParams.payerName = $('#payerName').val();
                    giroParams.callDt = $('#callDt').val();
 					giroParams.domain = 'https://www.ilovegohyang.go.kr';

                    if(vm.giroParams.giroNo === undefined) {
                        alert('지로번호 선택하세요');
                        return false;
                    }

					giroPopup = window.open("", "popOpen", "width=720, height=682,scrollbars=yes, titlebar=0, toolbar=0, left=300, top=200");

					$s.api.postSubmit('/api/ngdonation/giroPayTest', giroParams, function (response) {

                        if (response.isMobile == 'Y') {   //모바일
                            giroPopup.resizeTo(550, 800);
                        } else {
                            giroPopup.resizeTo(600, 800);
                        }
                        let form = document.createElement('form');
                        form.setAttribute('method','post');
                        form.setAttribute('target','popOpen');
                        form.setAttribute('action', 'https://test.giro.or.kr/epay/hometown/index.do');

                        let input = document.createElement('input');
                        input.setAttribute('type', 'hidden'); // 태그 속성 설정
                        input.setAttribute('id', 'ENC_DATA');
                        input.setAttribute('name', 'ENC_DATA');
                        input.setAttribute('value', response.result.data);

                        form.appendChild(input);

                        document.body.appendChild(form);
                        form.submit();

                    }, function (err) {
						$s.error(err);
                    });

                },

            },
            computed: {

            },
            watch: {
				selectGiroNo: function (giroNo) {
                    if (giroNo != '') {
                        vm.changeGiroNo(giroNo);
                    } else {
                        vm.giroParams = {};
						$('#sortCode').val('');
                        $('#giroNo').val('');
                        $('#elecNo').val('');
                        $('#payerName').val('');
                        $('#birthDate').val('');
                        $('#callDt').val('');

            mounted: function () {

                    // 페이지 로딩 후 실행

                });
