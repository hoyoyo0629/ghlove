    <script type="text/babel">

        Vue.use(VueAwesomeSwiper);
        var vm = new Vue({
            el: '#saleson',
            components: {
                'layout-header-ali': httpVueLoader('/components/layouts/header_ali.vue'),

            data: {
                // ali data
                userName: "",
                userGrade: "",
                selectedSurvey: "01",
                result: {},
                page: {
                    menuUrl: "/donation/guide4.html"
                },
            },
            methods: {
                radioChange: function (e) { // radio button checked value
                    vm.selectedSurvey = e.target.value;
                },
                goToSurvey: function () { // 현재 페이지 만족도

                    var message = "";
                    if (vm.selectedSurvey != null && vm.selectedSurvey != "") {
                        message = "만족도 평가를 등록하였습니다. 감사합니다.";
                    } else {
                        message = "만족도 평가 항목을 선택해 주세요";
                    }

                    $s.alert(message, function () {
                        location.reload();
                    });
                }


            },
            computed: {

            },
            mounted: function () {
                this.$nextTick(function () {
                    // 페이지 로딩 후 실행
                    Saleson.init();
                    //setTimeout(() => this.init(), 100);
                });
            }
        });
