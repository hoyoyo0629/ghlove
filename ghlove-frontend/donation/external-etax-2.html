        <script type="text/babel">
            Vue.use(VueAwesomeSwiper);

            let eTaxPopup;
            let etaxPopTimer;

            let vm = new Vue({
                el: '#saleson',
                components: {
                    alert: httpVueLoader("/components/layouts/alert.vue"),
                    toast: httpVueLoader("/components/layouts/toast.vue"),
                    layoutLoading: httpVueLoader("/components/layouts/loading.vue"),
                },
                data: {
                    param: {
                        epayno: "",
                        returnUrl: "",
                        returnMethod: ""
                    },
                    userCntrInfo : {
                        cntrSn: "",
                        cntrDe: "",
                        userId: "",
                        psitnLocgovCode: "",
                        cntrLocgovCode: "",
                        cntrAmt: "",
                        cntrBlcePoint: "",
                        elctrnPayNo: "",
                        seoulTrgetAt: "",
                        cntrSttusCode: "",
                        sttemntPayDe: "",
                        mngNo : "",
                        foreignStatusCode : "",
                        cntrPoint : "",
                        userName : "",
                        birthday : "",
                        rtnpsntReqstCode : ""
                    },
					deeplink: "N",
                },
                mounted : function () {
                    this.$nextTick(function () {
                        // 페이지 로딩 후 실행
                        Saleson.init({});
                    });
                },
                methods: {
                    etaxOpenPopup: function (mngNo, elctrnPayNo, cntrAmt, sunapObj, cntrLocgovCode) {
                        donation.seoul.etaxPopOpenExternal(vm.mngNo, elctrnPayNo, cntrAmt)
                        .then(function (response) {
                            // console.log("atfer etaxPopOpenExternal response :: " + response);

                            var etaxPopTimer = setInterval(function () {
                                if (donation.giroPopup.closed) {
									vm.showLoading(true);
                                    clearInterval(etaxPopTimer);
                                    setTimeout(function () {
                                        donation.modal.hide();
                                        sunapObj.enapbuNo = elctrnPayNo;
                                        sunapObj.jijacheCd = cntrLocgovCode;
                                        vm.etaxSunapProcess(sunapObj);
                                    }, 1500);
                                }
                            }, 500);
                        })
                        .catch(function(msg) {      // 팝업 차단일 경우
                            /*console.log("atfer error msg :: " + msg);
                            result = msg;
                            resData = "";

                            // 결과 전송
                            vm.sendResult(result, resData);*/
                            //vm.sendResult("팝업이 차단되어 있습니다.", "");
							vm.showLoading(false);
                            $s.alert("팝업이 차단되어 있습니다.", function () {
                                $s.closeAlert();
                                vm.etaxOpenPopup(mngNo, elctrnPayNo, cntrAmt, sunapObj, cntrLocgovCode);
                                //vm.selfClose();
                            });
                        });
                    },
                    etaxSunapProcess: function (sunapObj) {
                        donation.sunapSuccessExternal2(sunapObj)
                        .then(function (response) {
							vm.showLoading(false);
                            if (response.result.sunap == 'SUCCESS') {
								vm.sendResult("성공", "");
							} else {
								if (response.result.msg) {
									vm.sendResult(response.result.msg, "");
								} else {
									vm.sendResult("결제완료가 확인되지 않습니다.", "");
								}
							}
                        })
                        .catch(function(msg) {
							vm.showLoading(false);
                            // console.log("atfer error msg :: " + msg);
                            let result = msg;
                            let resData = "";

                            // 결과 전송
                            vm.sendResult(result, resData);
                        });
                    },
                    sendResult: function (result, resData) {
                        let url = vm.param.returnUrl;
                        let method = vm.param.returnMethod;

                        // 리턴 url이 있을 경우에만 결과 리턴
                        if(url !== undefined && url !== null && $.trim(url).length > 0) {
                            // http or https로 시작하는지 확인
                            const regExp = /^(http|https):\/\//;

                            // 결제 성공
                            if(result == "성공"){
                                if(regExp.test(url)) {
                                    // 결과 전송
                                    vm.sendResultData('0000', resData);
                                }
                                $s.alert('결제에 성공했습니다.', function () {
                                    $s.closeAlert();
                                    vm.selfClose();
                                });
                            }
                            else{
                                if(regExp.test(url)) {
                                    // 결과 전송
                                    vm.sendResultData('0223', resData);
                                }
                                $s.alert(result, function () {
                                    $s.closeAlert();
                                    vm.selfClose();
                                });
                            }
                        }
                        else{
                            // 결제 성공
                            if(result == "성공"){
                                $s.alert('결제에 성공했습니다.', function () {
                                    $s.closeAlert();
                                    vm.selfClose();
                                });
                            }
                            else{
                                $s.alert(result, function () {
                                    $s.closeAlert();
                                    vm.selfClose();
                                });
                            }
                        }
                    },
                    // post type send
                    sendResultData(rsltCd, resData){
						if (this.deeplink == 'Y') {
							let param = '?rsltCd=' + rsltCd + "&epayno=" + vm.param.epayno + "&responseData=" + resData;
							location.href = vm.param.returnUrl + param;
							return;
						}

                        let data = {
                            "rsltCd" : rsltCd
                            , "epayno" : vm.param.epayno
                            , "responseData" : resData
                        };
                        $.ajax({
                            url: vm.param.returnUrl
                            , type: vm.param.returnMethod
                            , data: JSON.stringify(data)
                            , contentType:"application/json"
                            , crossDomain: true
                            , success : function (response) {

                            }
                            , error : function (error) {

                            }
                        });
                    },

                    showLoading: function (isLoading) {
                        this.$refs.layoutLoading.showLoading(isLoading);
                    },

                    showDonationLoading: function (isLoading) {
                        this.$refs.donationLoading.showDonationLoading(isLoading);
                    },

                    selfClose: function () {
                        setTimeout(
                            function () {
                                window.close();
                            }
                            , 500
                        );
                    },

                    loadingMounted: function () {
                        vm.param.epayno = $s.core.getParameter("epayno") ? $s.core.getParameter("epayno") : "";
                        vm.param.returnUrl = $s.core.getParameter("returnUrl") ? $s.core.getParameter("returnUrl") : "";
                        vm.param.returnMethod = $s.core.getParameter("returnMethod") ? $s.core.getParameter("returnMethod") : "get";

						this.deeplink = $s.core.getParameter("deeplink") ? $s.core.getParameter("deeplink") : "N";

                        let result = "";
                        let resData = "";

                        let parameter = {
                            "epayno" : vm.param.epayno
                        };

                        let sunapObj = new Object();

						this.showLoading(true);
                        // 관리번호, 납부 금액조회
                        $s.api.postSubmit('/api/external/userCntrInfo', parameter, function (response) {
							vm.showLoading(false);
                            if (response.result !== undefined && response.result !== null) {
                                // 조회 결과 set
                                vm.userCntrInfo.cntrSn = response.result.cntrSn;
                                vm.userCntrInfo.cntrDe = response.result.cntr_de;
                                vm.userCntrInfo.userId = response.result.user_id;
                                vm.userCntrInfo.psitnLocgovCode = response.result.psitn_locgov_code;
                                vm.userCntrInfo.cntrLocgovCode = response.result.cntr_locgov_code;
                                vm.userCntrInfo.cntrAmt = response.result.cntr_amt;
                                vm.userCntrInfo.cntrBlcePoint = response.result.cntr_blce_point;
                                vm.userCntrInfo.elctrnPayNo = response.result.elctrn_pay_no;
                                vm.userCntrInfo.seoulTrgetAt = response.result.seoul_trget_at;
                                vm.userCntrInfo.cntrSttusCode = response.result.cntr_sttus_code;
                                vm.userCntrInfo.sttemntPayDe = response.result.sttemnt_pay_de;
                                vm.userCntrInfo.foreignStatusCode = response.result.foreign_status_code;
                                vm.userCntrInfo.cntrPoint = response.result.cntr_point;
                                vm.userCntrInfo.userName = response.result.user_name;
                                vm.userCntrInfo.birthday = response.result.birthday;
                                vm.userCntrInfo.rtnpsntReqstCode = response.result.rtnpsnt_reqst_code;

                                vm.userCntrInfo.mngNo = response.mngNo;

                                // 기부 가능 정보 확인
                                if(vm.userCntrInfo.cntrSn !== undefined && vm.userCntrInfo.cntrSn !== "" ) {
                                    vm.etaxOpenPopup(vm.userCntrInfo.mngNo
                                                    , vm.userCntrInfo.elctrnPayNo
                                                    , vm.userCntrInfo.cntrAmt
                                                    , sunapObj
                                                    , vm.userCntrInfo.cntrLocgovCode);
                                }
                                else{
                                    result = "기부가능 정보가 없습니다.";
                                    resData = "";

                                    // 결과 전송
                                    vm.sendResult(result, resData);
                                }
                            }
                            else {
                                result = "납부번호 조회에 실패 했습니다.";
                                resData = "";

                                // 결과 전송
                                vm.sendResult(result, resData);
                            }
                        },
                        function (error) {
							vm.showLoading(false);
                            result = "기부자 정보 조회 API연결에 실패하였습니다.";
                            resData = "";
                            // 결과 전송
                            vm.sendResult(result, resData);
                        });

                    },

                    donationLoadingMounted: function () {
                        // 로딩바 컴포넌트가 화면에 그려진 이후 호출되는 함수. 부모컴포넌트에서 바로 로딩바 호출시 그려지기 전에 호출하여 오류 발생하는 경우 있음
                        this.$emit("donationLoading-mounted");

                        // 로딩바 테스트시 아래 주석 풀고 위 emit 부분 주석처리
                        /*
                        this.showDonationLoading(true);
                        setTimeout(() => this.showDonationLoading(false)
                          , 1000);
                        */
                    },
                },
            });

            // 캐시 초기화
            window.addEventListener('unload', function(){});
            window.addEventListener('beforeunload', function(){
                donation.closeGiroPop();
            });
        </script>
